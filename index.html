<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrum Project Simulator</title>
<style>
/* Layout idea: a Jira-like workspace (top bar, project sidebar, work area) with a lesson rail on the right that walks students through the Scrum cycle. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunken:#f4f5f7; --ink:#172b4d; --muted:#5e6c84; --line:#dfe1e6;
  --accent:#0052cc; --accent-ink:#ffffff; --accent-soft:#deebff; --gnav:#0747a6;
  --good:#1d7f55; --good-soft:#dcf2e7; --warn:#a55f00; --warn-soft:#fcefd6; --bad:#c3372b; --bad-soft:#fde3e0;
  --violet:#6a4bd3; --violet-soft:#ece7fc;
  --hint:#f2a516; --hint-ink:#2a1a00;
  --font-d:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-b:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --shadow:0 1px 2px rgba(23,33,49,.08), 0 2px 8px rgba(23,33,49,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1a2029; --sunken:#222a35; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2e3846;
    --accent:#6b98ff; --accent-ink:#0d1320; --accent-soft:#1f2c47;
    --good:#4cc38a; --good-soft:#173328; --warn:#e7a644; --warn-soft:#3a2c14; --bad:#ff7a6d; --bad-soft:#3c1f1c;
    --violet:#a48dff; --violet-soft:#2a2347; --gnav:#0b2a5c;
    --hint:#f5b43a; --hint-ink:#2a1a00;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --sunken:#222a35; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2e3846;
  --accent:#6b98ff; --accent-ink:#0d1320; --accent-soft:#1f2c47;
  --good:#4cc38a; --good-soft:#173328; --warn:#e7a644; --warn-soft:#3a2c14; --bad:#ff7a6d; --bad-soft:#3c1f1c;
  --violet:#a48dff; --violet-soft:#2a2347;
  --hint:#f5b43a; --hint-ink:#2a1a00;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark;
  --gnav:#0b2a5c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:24px;font-weight:500} h2{font-size:18px} h3{font-size:15px}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%}
.shell{display:grid;grid-template-rows:52px 1fr;height:100%}
.top{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:700;font-size:16px}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.crumb{color:var(--muted);font-size:14px}
.top .spacer{flex:1}
.body{display:grid;grid-template-columns:52px 216px minmax(0,1fr) 360px;min-height:0}
.body.nolesson{grid-template-columns:52px 216px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.proj{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}
.proj-av{width:34px;height:34px;border-radius:7px;background:var(--violet);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-weight:700}
.proj small{display:block;color:var(--muted);font-size:12px}
.navh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;color:var(--ink)}
.nav:hover{background:var(--sunken)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav[disabled]{opacity:.45;cursor:not-allowed}
.nav svg{flex:none}
.main{overflow:auto;padding:22px 26px 60px;min-width:0}
.lesson{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f > span.hint{font-weight:400}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head p{color:var(--muted);margin:4px 0 0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.stack{display:grid;gap:14px;align-content:start}
.row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}

.loz{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.loz.todo{background:var(--sunken);color:var(--muted)}
.loz.inprogress{background:var(--accent-soft);color:var(--accent)}
.loz.review{background:var(--violet-soft);color:var(--violet)}
.loz.done{background:var(--good-soft);color:var(--good)}
.loz.blocked{background:var(--bad-soft);color:var(--bad)}
.loz.active{background:var(--accent-soft);color:var(--accent)}
.loz.closed{background:var(--good-soft);color:var(--good)}
.loz.future{background:var(--sunken);color:var(--muted)}
.fixv{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--muted);white-space:nowrap}
.epic-tag{display:inline-block;font-size:12px;font-weight:600;padding:0 7px;border-radius:4px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pts{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 6px;border-radius:10px;background:var(--sunken);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pts.none{color:var(--muted);font-weight:600}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.av.empty-av{background:var(--sunken);color:var(--muted);border:1px dashed var(--line)}
.ti{width:16px;height:16px;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.ti svg{width:10px;height:10px}
.ti-story{background:#36a36b}.ti-task{background:#3b7ae0}.ti-bug{background:#d9473b}.ti-epic{background:#7a55e0}
.prio{font-size:13px;font-weight:700;width:16px;text-align:center;flex:none}
.p-Highest,.p-High{color:var(--bad)} .p-Medium{color:var(--warn)} .p-Low,.p-Lowest{color:var(--accent)}

/* backlog */
.bl{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.epics{position:sticky;top:0}
.epic-scroll{max-height:62vh;overflow:auto;margin-bottom:8px;padding:2px}
.epic-item{display:grid;gap:4px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;margin-bottom:8px;text-align:left;width:100%}
.epic-item.on{outline:2px solid var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--good)}
.section{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.section.dropping{outline:2px dashed var(--accent);outline-offset:-2px}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-h h3{font-size:15px}
.sec-goal{padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px;background:var(--sunken)}
.sec-goal b{color:var(--muted);font-weight:600}
.cap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:220px}
.cap .bar{flex:1;height:8px}
.cap .bar > i.over{background:var(--bad)} .cap .bar > i.near{background:var(--warn)}
.irow{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:40px;background:var(--surface)}
.irow:last-child{border-bottom:0}
.irow:hover{background:var(--sunken)}
.irow.drag-over{box-shadow:inset 0 2px 0 var(--accent)}
.irow .key{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.irow .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow.done .sum{text-decoration:line-through;color:var(--muted)}
.grip{color:var(--muted);cursor:grab;font-size:14px;letter-spacing:-2px}
.fibrow{display:flex;gap:4px}
.fib{border:1px solid var(--line);background:var(--surface);border-radius:5px;min-width:26px;height:24px;font-size:12px;font-weight:700;cursor:pointer;padding:0 5px}
.fib:hover{border-color:var(--accent)}
.fib.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.create-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.create-row select{width:auto}
.dropzone-empty{padding:16px 14px;color:var(--muted);font-size:14px;text-align:center}

/* board */
.board{display:grid;grid-template-columns:repeat(9,minmax(190px,1fr));gap:10px;align-items:start;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.col.c-blocked{background:var(--bad-soft)}
.col-def{font-size:11.5px;color:var(--muted);padding:0 4px 10px;line-height:1.3}
.qf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.qf button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 11px;font-size:13px;cursor:pointer}
.qf button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.col{background:var(--sunken);border-radius:10px;padding:10px;min-height:360px}
.col.dropping{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:2px 4px 10px}
.bcard{background:var(--surface);border-radius:8px;padding:10px 11px;box-shadow:var(--shadow);margin-bottom:8px;cursor:grab;display:grid;gap:8px;border-left:3px solid transparent}
.bcard.blocked{border-left-color:var(--bad)}
.bcard .t{font-size:14px}
.bcard .meta{display:flex;align-items:center;gap:7px}
.bcard .meta .key{font-size:12px;color:var(--muted);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.flag{font-size:12px;color:var(--bad);font-weight:600;background:var(--bad-soft);padding:3px 7px;border-radius:5px}
.prog{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.prog > i{display:block;height:100%;background:var(--accent)}
.sprint-bar{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:14px;align-items:start}
.daypill{font-family:var(--font-d);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:12px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner .btn{margin-left:auto}
.standup{margin-top:16px}
.su-line{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.su-line.h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}

/* charts */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ideal{stroke:var(--muted);stroke-dasharray:4 4;fill:none;stroke-width:1.5}
.chart .actual{stroke:var(--accent);fill:none;stroke-width:2.5}
.chart .area{fill:var(--accent);opacity:.1}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .scope{stroke:var(--warn);stroke-width:2}
.chart .b-commit{fill:var(--line)} .chart .b-done{fill:var(--good)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--sunken);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-d);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}

/* retro */
.retro{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px;overflow-x:auto}
.rcol{border-radius:10px;padding:12px;min-height:300px;background:var(--sunken)}
.rcol h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rcol .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.rcol.well h3 i{background:var(--good)} .rcol.improve h3 i{background:var(--warn)} .rcol.action h3 i{background:var(--accent)}
.rcol h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.note{background:var(--surface);border-radius:8px;padding:9px 10px;box-shadow:var(--shadow);margin-bottom:8px;display:grid;gap:6px;font-size:14px}
.note .acts{display:flex;gap:6px;align-items:center}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 8px;font-size:12px;font-weight:700;cursor:pointer}

/* lesson */
.steps{display:grid;gap:2px;margin:10px 0 16px}
.step{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.step:hover{background:var(--sunken)}
.step.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.step .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:10px}
.step.ok .dot{background:var(--good);border-color:var(--good);color:#fff}
.lesson h2{font-size:19px;margin:4px 0 10px}
.lesson .eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lbody{font-size:14.5px;max-width:65ch}
.tasks{margin:14px 0;display:grid;gap:6px}
.task{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.task .box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.task.ok .box{background:var(--good);border-color:var(--good);color:#fff}
.task.ok span{color:var(--muted);text-decoration:line-through}
.tip{background:var(--sunken);border-left:3px solid var(--violet);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.tip b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-bottom:2px}
.lnav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* modal + dialog */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:start center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:12px;width:min(920px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.m-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-b{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;padding:18px}
.m-b .sumin{font-family:var(--font-d);font-size:19px;font-weight:700;border-color:transparent;padding:4px 6px;margin-left:-7px}
.m-b .sumin:hover,.m-b .sumin:focus{border-color:var(--line)}
.fields{display:grid;gap:12px;align-content:start}
.list-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.list-item span{flex:1}
.blockbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:8px}
.poker{background:var(--sunken);border-radius:8px;padding:12px;display:grid;gap:10px}
.pcards{display:flex;gap:8px;flex-wrap:wrap}
.pcard{width:52px;height:70px;border-radius:7px;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:20px;background:var(--surface);border:1.5px solid var(--line)}
.pcard.down{background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 6px,var(--accent-soft) 6px,var(--accent-soft) 12px);border-color:var(--accent)}
.pwho{font-size:11px;text-align:center;color:var(--muted);margin-top:3px;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dialog{background:var(--surface);border-radius:12px;width:min(520px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25);padding:20px;display:grid;gap:12px;margin-top:40px}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dialog ul{margin:0;padding-left:18px}
.note-warn{background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:6px;font-size:14px}
.note-bad{background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:6px;font-size:14px}
#tour{position:fixed;inset:0;pointer-events:none;z-index:35}
.tdot{position:fixed;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--hint);color:var(--hint-ink);font:700 12px/24px var(--font-b);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tdot.first::after{content:"";position:absolute;inset:-6px;border-radius:18px;border:2px solid var(--hint);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.5)}}
.tcall{position:fixed;background:var(--hint);color:var(--hint-ink);border-radius:8px;padding:8px 11px;font-size:13.5px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.tcall b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.tour-hl{outline:2px solid var(--hint) !important;outline-offset:2px}
.tnum{font-size:10px;font-weight:700;color:var(--hint-ink)}
.task:not(.ok) .box{background:var(--hint);border-color:var(--hint)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;max-width:min(560px,90vw)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* board settings */
.bs{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.bs-nav{display:grid;gap:2px}
.bs-nav button,.bs-nav span{display:block;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;font-size:14px;color:var(--accent);cursor:pointer}
.bs-nav span{color:var(--muted);cursor:default;opacity:.7}
.bs-nav button.on{background:var(--accent-soft);font-weight:700;color:var(--ink)}
.cm{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.cm-col{min-width:150px;background:var(--sunken);border-radius:6px;padding:10px;display:grid;gap:8px;align-content:start}
.cm-col.unm{background:transparent;border:1.5px dashed var(--line)}
.cm-h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.cm-st{display:flex;gap:4px;flex-wrap:wrap;min-height:22px}
.cm-mv{display:flex;justify-content:space-between}
.note-ok{background:var(--good-soft);color:var(--good);padding:8px 10px;border-radius:6px;font-size:14px}
.simbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sunken);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.qf .clear{border:0;background:none;color:var(--accent)}
.bc{font-size:14px;color:var(--muted);margin-bottom:6px}
.sec-foot{display:flex;justify-content:flex-end;gap:12px;padding:8px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.gstrip{background:var(--gnav);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.gstrip button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center}
.gstrip button:hover{background:rgba(255,255,255,.18)}
.gstrip .sp{flex:1}
.gstrip .me{background:rgba(255,255,255,.2);font-size:12px;font-weight:700}
.side .board-item{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:0 0 6px;border-radius:6px;background:var(--sunken);font-size:14px}
.side .board-item small{display:block;color:var(--muted);font-size:12px}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.nav.dis{opacity:.45;cursor:default}
@media (max-width:860px){.bs{grid-template-columns:1fr}.gstrip{display:none}}
/* onboarding */
.onb-steps{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:14px;color:var(--muted)}
.onb-steps span{display:flex;align-items:center;gap:7px}
.onb-steps i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.onb-steps .on{color:var(--accent);font-weight:700} .onb-steps .on i{border-color:var(--accent)}
.onb-steps .ok i{background:var(--good);border-color:var(--good);color:#fff}
.onb{max-width:760px}
.onb-acc{display:grid;grid-template-columns:240px 1fr;gap:26px}
.onb-side ul{padding-left:18px;margin:10px 0;display:grid;gap:4px}
.onb-q{background:var(--violet);color:#fff;border-radius:10px;padding:16px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:5px;padding:6px 11px;cursor:pointer;font-size:14px}
.chip:hover,.chip.on{background:rgba(255,255,255,.34)}
.link{border:0;background:none;color:inherit;opacity:.8;cursor:pointer;justify-self:end;text-decoration:underline;font-size:13px}
.site-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding-right:10px}
.site-in input{border:0;background:transparent}
.site-in span{color:var(--muted);font-weight:400}
.qs p{margin:0 0 10px;font-size:16px}
.qs select.unset{border-color:var(--hint)}
@media (max-width:700px){.onb-acc{grid-template-columns:1fr}}
/* setup */
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tplc{border:1.5px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:var(--surface);text-align:left;display:grid;gap:6px}
.tplc.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tplc small{color:var(--muted)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .arrow{color:var(--muted)}
.hier{display:grid;gap:6px;font-size:14px}
.hier div{display:flex;align-items:center;gap:8px}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.radio input{margin-top:4px}
.role-card{border-top:3px solid var(--accent)}
.role-card.po{border-top-color:var(--violet)} .role-card.sm{border-top-color:var(--warn)} .role-card.dev{border-top-color:var(--good)}

@media (max-width: 1180px){ .body{grid-template-columns:52px 200px minmax(0,1fr) 300px} .body.nolesson{grid-template-columns:52px 200px minmax(0,1fr)} .bl{grid-template-columns:1fr} .epics{position:static} }
@media (max-width: 860px){
  .body,.body.nolesson{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto}
  .shell{grid-template-rows:auto 1fr}
  .top{flex-wrap:wrap;padding:8px 16px}
  .side{display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}
  .side .proj,.side .navh{display:none}
  .nav{width:auto;white-space:nowrap}
  .main{overflow:visible;padding:16px}
  .lesson{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .m-b{grid-template-columns:1fr}
  .sprint-bar{grid-template-columns:1fr}
  .su-line{grid-template-columns:1fr}
  .su-line.h{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} .tdot.first::after{animation:none} }
</style>
</head>
<body>
