<div id="toast" role="status" aria-live="polite"></div>
<div id="tour" aria-hidden="true"></div>
<script>
'use strict';
const KEY='scrumsim-vas-v5';
const FIB=[1,2,3,5,8,13,20,40,100];
const ST=[['backlog','Backlog'],['sprintbacklog','Current Sprint Backlog'],['blocked','Blocked'],['design','Design'],['development','Development'],['unittesting','Unit Testing'],['qa','QA'],['uat','UAT'],['done','Done']];
const ST_DEF={backlog:'Stories, tasks, sub-tasks or bugs that need the Product Team to work on them before they can be treated as ready.',sprintbacklog:'Ready to be worked on in this sprint.',blocked:'Currently blocked by an impediment.',design:'A design component is being worked on (Creative, UX/IA).',development:'Under development and/or configuration.',unittesting:'Being tested by the development team.',qa:'Under QA testing.',uat:'Being tested by business users.',done:'Successfully deployed to production and ready to use. Bugs are not "done"; they are closed.'};
const ST_GROUP={backlog:'todo',sprintbacklog:'todo',blocked:'blocked',design:'inprogress',development:'inprogress',unittesting:'inprogress',qa:'review',uat:'review',done:'done'};
const WORKING=['design','development','unittesting'];
const ROLES=['Product Owner','Scrum Master','Developer','Stakeholder'];
const PRIOS=['Highest','High','Medium','Low','Lowest'];
const PRIO_ICON={Highest:'⇈',High:'↑',Medium:'=',Low:'↓',Lowest:'⇊'};
const EPIC_COLORS=['#7a55e0','#d06a12','#0f8a8c','#c23f78','#4f7d1d','#2456d3'];
const AV_COLORS=['#2456d3','#7a55e0','#0f8a8c','#c23f78','#d06a12','#4f7d1d','#8a5a2b','#3b6e8f'];
const TYPE_LABEL={story:'Story',task:'Task',bug:'Bug',epic:'Epic'};
const GLYPH={
  story:'<svg viewBox="0 0 10 10"><path d="M2.5 1h5v8L5 7 2.5 9z" fill="#fff"/></svg>',
  task:'<svg viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" stroke="#fff" stroke-width="1.8" fill="none"/></svg>',
  bug:'<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3" fill="#fff"/></svg>',
  epic:'<svg viewBox="0 0 10 10"><path d="M6 1L2 6h3l-1 3 4-5H5z" fill="#fff"/></svg>'
};
const BLOCKERS=['Waiting for Bose to send the speaker and amp specs','Creative copy not approved yet','Demo tablet at the show stand is broken','Needs access to the Neo vehicle data feed'];
const REQUESTS=[
  ['Get In app crashes when opening the Audio System screen','Visitors at the stand report the app closes when they tap Audio System. The show opens to the public on Friday.'],
  ['Vehicle prices show without VAT on the Dashboard screen','The sales team says prices on the Dashboard screen are missing VAT, which confuses visitors.'],
  ['Screen saver does not start on the kiosk tablets','Kiosk tablets at the stand stay on the last screen instead of showing the screen saver.']
];
const SAMPLE_RELEASES=[{name:'Release 1',start:'2019-07-01',end:'2019-10-04',desc:'Get In bare bones'},{name:'Release 2 - MVP',start:'2019-10-07',end:'2020-04-10',desc:'Full release of all features'}];
const EPIC_SUMMARY={'Audio System':'As a user, I would like to be able to see and pick the type of audio system available for Neo vehicle','Look & Feel':'As a user, I would like to have proper placements of information on each screen'};
const NINE=ST.map(x=>x[1]);
const SAMPLE_EPICS=['Audio System','Navigation','Look & Feel','Sunroof','Dashboard','PCM System','Video System','Seats','Climate System','Drive Feature','Transmission','Park Monitoring','Content','Screen Saver','Test Drive','Share Content','Subscribe'];
const DOD_AUDIO='The story is complete when the user is presented with the types of speakers and amp offered for the Neo Core Audio System with all creative, copy and feature specs.';
/* [epic, type, summary, size, priority, acceptance criteria, definition of done, release] */
const SAMPLE_ITEMS=[
  ['Look & Feel','story','Neo Core Audio System Look & Feel Spike',5,'High',['Given a user has navigated to the Bose Audio System screen on the Get In application, when he clicks on "Neo Core Audio System", then the user is presented with a proper layout featuring all of the correct creative, copy and feature specs'],'The story is complete when the user is presented with the correct placement of copy, creative and feature specs.','Release 1','As a Neo vehicle enthusiast, I would like to understand where the Neo Core Audio System offering placements are (creative, copy, feature specs), so I can have a better understanding of the overall layout in order to correctly place all of the components for the user on screen','Brent Smith','Look & Feel, Neo Core Audio System'],
  ['Audio System','story','Neo Core Audio System',20,'High',['Given a user has navigated to the Bose Audio System screen on the Get In application, when he clicks on "Neo Core Audio System", then the user is taken to the "Neo Core Audio System" screen where he can find more about the types of speakers and amp offered'],DOD_AUDIO,'Release 1','As a Neo vehicle enthusiast, I would like to understand what Neo Core Audio System offerings are available for the vehicle, so I can be better informed what type of speakers and amp are available','Momenti Go','Audio System'],
  ['Navigation','story','As a Neo vehicle enthusiast, I would like to be able to navigate to a previous page, so that I can review what I have seen and read',3,'High',[],'','Release 1','','',''],
  ['Navigation','story','As a Neo vehicle enthusiast, I would like to be able to navigate through the entire application',8,'Highest',[],'','Release 1','','',''],
  ['Screen Saver','story','As a show visitor, I would like to see a Neo screen saver when the kiosk is idle, so that the stand always looks attractive',5,'High',[],'','Release 1','','',''],
  ['Audio System','task','Research spike for audio systems',2,'Medium',[],'','Release 1','','Sandra Price','Audio System'],
  ['Audio System','story','As a Neo vehicle enthusiast, I would like to understand what Bose offerings are available for the vehicle, so I can be better informed what type of speakers and amp are available',8,'Medium',[],'','Release 1','','','Audio System'],
  ['Audio System','story','As a Neo vehicle enthusiast, I would like to understand what Neo Premium Audio System offerings are available for the vehicle, so I can be better informed what type of speakers and amp are available',8,'Medium',[],'','Release 1','','','Audio System'],
  ['Subscribe','story','As a Neo vehicle enthusiast, I would like to subscribe to receiving more information about Neo vehicle',3,'Medium',[],'','Release 1','','',''],
  ['Audio System','story','As a user of Get In app, I want to be able to pick a good quality system, so we can enjoy this service together',5,'Low',[],'','Release 2 - MVP','','',''],
  ['Seats','story','As a user, I would like to be able to see and pick the type of seat available for Neo vehicle',5,'Medium',[],'','Release 2 - MVP','','',''],
  ['Seats','story','As a Neo vehicle enthusiast, I would like to pick a seat based on type, material and color',8,'Medium',[],'','Release 2 - MVP','','',''],
  ['Seats','story','As a user, I would like to be able to see and pick the type of colour seat available for Neo vehicle',3,'Low',[],'','Release 2 - MVP','','','']
];
const SAMPLE_TEAM=[['Nick Stekovic','Scrum Master','Scrum Master'],['Sandra Price','Developer','Business Analyst'],['Brent Smith','Developer','UX / IA'],['Momenti Go','Developer','Front-end Developer'],['Product Owner (rename me)','Product Owner','Product Owner']];
const SAMPLE_QF=[['Sandra Price','assignee = "Sandra Price"','All tasks for Sandra Price'],['Brent Smith','assignee = "Brent Smith"','All tasks for Brent Smith'],['Momenti','assignee = "Momenti Go"','All tasks for Momenti Go']];

/* ---------- state ---------- */
function fresh(){return {v:5,onb:0,site:null,qfs:[{id:'qf-me',name:'Only My Issues',jql:'assignee = currentUser()',desc:'Displays issues which are currently assigned to the current user',builtin:'me'},{id:'qf-recent',name:'Recently Updated',jql:'updatedDate >= -1d',desc:'Displays issues which have been updated in the last day',builtin:'recent'}],columns:[{name:'To Do',statuses:['backlog','sprintbacklog','blocked'],dflt:1},{name:'In Progress',statuses:['design','development','unittesting','qa','uat'],dflt:1},{name:'Done',statuses:['done'],dflt:1}],estimation:'Story Points',workdays:[1,2,3,4,5],stage:0,view:'setup',lesson:true,project:null,team:[],epics:[],issues:[],sprints:[],n:0,flags:{},retro:[],releases:[],filterEpic:null,reportSprint:null,retroSprint:null}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===5)return s}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let UI={modal:null,poker:null,dlg:null,estimate:false,drag:null,tpl:'scrum',mgmt:'company',qf:null};

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>S.issues.find(i=>i.id===id);
const member=id=>S.team.find(m=>m.id===id);
const epicOf=id=>S.epics.find(e=>e.id===id);
const sprintOf=id=>S.sprints.find(s=>s.id===id);
const activeSprint=()=>S.sprints.find(s=>s.state==='active');
const closedSprints=()=>S.sprints.filter(s=>s.state==='closed');
const byRank=(a,b)=>a.rank-b.rank;
const sprintIssues=sid=>S.issues.filter(i=>i.sprint===sid).sort(byRank);
const backlogIssues=()=>S.issues.filter(i=>!i.sprint).sort(byRank);
const pts=i=>i.points||0;
const sum=list=>list.reduce((a,i)=>a+pts(i),0);
const devs=()=>S.team.filter(m=>m.role==='Developer');
const stories=()=>S.issues.filter(i=>i.type==='story');
const val=id=>{const el=document.getElementById(id);return el?el.value:''};
const initials=n=>n.split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function avColor(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length]}
function av(m,size){if(!m)return `<span class="av empty-av" title="Unassigned" ${size?`style="width:${size}px;height:${size}px"`:''}>?</span>`;return `<span class="av" title="${esc(m.name)}" style="background:${avColor(m.name)};${size?`width:${size}px;height:${size}px;`:''}">${esc(initials(m.name))}</span>`}
const ti=t=>`<span class="ti ti-${t}" title="${TYPE_LABEL[t]}">${GLYPH[t]}</span>`;
const prio=p=>`<span class="prio p-${p}" title="${p} priority">${PRIO_ICON[p]}</span>`;
const ptsChip=i=>i.type==='task'?`<span class="pts none" title="Tasks don't get story points">task</span>`:i.points?`<span class="pts" title="Story points">${i.points}</span>`:`<span class="pts none" title="Not estimated">–</span>`;
function epicTag(id){const e=epicOf(id);if(!e)return'';return `<span class="epic-tag" style="background:${e.color}22;color:${e.color}">${esc(e.name)}</span>`}
const fmtD=d=>{if(!d)return'';const x=new Date(d+'T00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const statusLabel=s=>(ST.find(x=>x[0]===s)||[,''])[1];
const stCls=s=>ST_GROUP[s]||'todo';
function setStatus(i,s){if(s===i.status)return;{const a=S.sprints.find(x=>x.state==='active');i.updDay=a?a.day:0}if(s==='blocked'){i.prevStatus=i.status==='blocked'?i.prevStatus:i.status;if(!i.blocked)i.blocked='Blocked by an impediment'}else{if(i.status==='blocked'||i.blocked){i.blocked=null}}i.status=s;const need=i.points||i.size||3;if(s==='done'||s==='qa'||s==='uat')i.progress=Math.max(i.progress||0,need);if(s==='backlog'||s==='sprintbacklog')i.progress=0;if(s==='design')i.progress=Math.max(0,Math.min(i.progress||0,need*.19));if(s==='development')i.progress=Math.max(need*.2,Math.min(i.progress||0,need*.69));if(s==='unittesting')i.progress=Math.max(need*.7,Math.min(i.progress||0,need*.99))}
function forecast(){const c=closedSprints();if(c.length){const last=c.slice(-3);const v=Math.round(last.reduce((a,s)=>a+s.completed,0)/last.length);return {val:v,why:`average velocity of your last ${last.length} sprint${last.length>1?'s':''}`}}const d=devs().length||3;return {val:d*10,why:`${d} developers × about 10 points each (no velocity history yet)`}}
function nextKey(){S.n++;return S.project.key+'-'+S.n}
function maxRank(){return S.issues.reduce((a,i)=>Math.max(a,i.rank),0)}
function minRank(){return S.issues.reduce((a,i)=>Math.min(a,i.rank),0)}
function newIssue(o){const i=Object.assign({id:uid(),key:nextKey(),type:'story',summary:'',desc:'',ac:[],epic:null,points:null,prio:'Medium',assignee:null,sprint:null,rank:maxRank()+1,subtasks:[],size:null,progress:0,blocked:null,mid:false,dod:'',fix:null,status:'backlog'},o);S.issues.push(i);return i}
function ensureReleases(){SAMPLE_RELEASES.forEach(r=>{if(!S.releases.some(x=>x.name.toLowerCase()===r.name.toLowerCase()))S.releases.push(Object.assign({},r))})}
function nineColumns(){S.columns=ST.map(([k,l])=>({name:l,statuses:[k]}))}
const columnsDone=()=>S.columns.length===9&&S.columns.every((c,k)=>c.name.toLowerCase()===NINE[k].toLowerCase());
const unmapped=()=>ST.map(x=>x[0]).filter(k=>!S.columns.some(c=>c.statuses.includes(k)));
const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10)};
function remaining(sp){return sum(sprintIssues(sp.id).filter(i=>i.status!=='done'))}

let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),4200)}
function commit(){save();render()}

/* ---------- lesson stages ---------- */
const STORY_RX=/as an? .+(i want|i would like|i'd like).+(so that|so i can|so we can)/i;
const STAGES=[
  {t:'Welcome',v:'setup',body:`<p>You'll run the <b>Vangelis Auto Show</b> project from the Jira tutorial videos: the <b>Get In</b> app for the Neo vehicle stand, as planned in the Agile simulator training. You go from an empty Jira site to a running sprint and beyond, using Scrum.</p><p>Scrum works in short, fixed cycles called <b>sprints</b>; this project uses two-week sprints. In each sprint the team plans, builds, shows what it built, and reflects on how it worked.</p><p>The amber bubbles show where to click for each task. Your project is saved in this browser only; press <b>Reset</b> at the top to start over.</p>`,tip:'This is a practice copy. Real Jira has many more settings, but the steps you learn here are the same.',checks:()=>[]},
  {t:'Sign up for Jira',v:'setup',body:`<p>Sign up for a free Jira Software Cloud trial (7 days). You choose a <b>site name</b>, which becomes your team's web address: <b>vangelisautoshow.atlassian.net</b>. Whoever signs up is the site admin.</p><p>Jira then asks what type of team you work in (<b>Software Development</b>) and what you do (choose <b>Other</b> and type <b>Scrum Master</b>). On <b>Invite your team</b> you can skip: in most organisations the users already exist (for example in Active Directory) and are added later. Finally, answer the setup questions and pick <b>Scrum</b>.</p>`,tip:'In Jira: sign up for the free trial at atlassian.com, confirm the email link, choose a site name, answer the welcome questions, skip or send invites, then answer "Help us set up your Jira".',video:'JiraTutorial1, from the start to about 4 min: the account and site name, the welcome questions, inviting the team and the setup questions.',fill:'site'},
  {t:'Create the project',v:'setup',body:`<p>Name the project <b>Vangelis Auto Show</b> with the key <b>VAS</b>; every issue is numbered VAS-1, VAS-2… Choose the <b>Scrum</b> template: it gives you a backlog, sprints, epics, releases and reports such as the burndown and velocity charts.</p><p>Then open <b>Board settings → Columns</b>. Delete the default To Do, In Progress and Done columns and add the 9 columns from the team's working agreement, in order, so everyone can see exactly where each feature is. Check that <b>Estimation</b> is Story Points and <b>Working days</b> are Monday to Friday.</p>`,tip:'In Jira: board ⋯ → Board settings → Columns. Delete the default columns, add Backlog, Current Sprint Backlog, Blocked, Design, Development, Unit Testing, QA, UAT, Done, and remove unmapped statuses. Estimation and Working days are in the same settings.',video:'JiraTutorial1, about 4 to 9 min: creating the Scrum project and setting up the 9 board columns.',checks:()=>[['Create a project with the Scrum template',!!S.project]],fill:'project'},
  {t:'Set up the Scrum team',v:'team',body:`<p>People must be <b>invited</b> to the Jira site before you can assign them work. In the videos: <b>Sandra Price</b> (Business Analyst), <b>Brent Smith</b> (UX/IA), <b>Momenti Go</b> (Front-end Developer) and Nick as <b>Scrum Master</b>. In Scrum terms, Sandra, Brent and Momenti are all <b>Developers</b>; the <b>Product Owner</b> owns and orders the backlog.</p><p>Then make a <b>quick filter</b> for each person, written in JQL: <code>assignee = "Sandra Price"</code>. On the board, clicking a name shows only that person's work, which is how you run the daily stand-up. If the person hasn't been invited yet, Jira says the user doesn't exist.</p>`,tip:'In Jira: Settings (gear) → User management → Invite users. Quick filters: board ⋯ → Board settings → Quick Filters → Name, JQL, Description → Add.',video:'JiraTutorial1, around 9 to 13 min (inviting users, quick filters) and JiraTutorial2, around 21 to 24 min.',checks:()=>{const r=x=>S.team.filter(m=>m.role===x).length;return [['Add a Product Owner',r('Product Owner')>=1],['Add a Scrum Master',r('Scrum Master')>=1],['Add at least 2 Developers',r('Developer')>=2]]},fill:'team'},
  {t:'Build the product backlog',v:'backlog',body:`<p>The epics come from the <b>story-mapping</b> workshops in the Agile simulator: Audio System, Navigation, Look &amp; Feel, Screen Saver and the rest. Epics should be created by the <b>Product Owner</b>. Each epic is then broken into <b>stories</b> (and tasks).</p><p>Follow the format from the working agreement: <i>As a [role], I would like [goal] so that [why]</i>. Every story needs <b>acceptance criteria</b> (Given… When… Then…) and a <b>Definition of Done</b>. Link it to its epic and add <b>labels</b> so you can group and filter later.</p>`,tip:'In Jira: Backlog → Create → Issue type Epic (Epic Name + Summary) or Story. Set Epic Link and Labels on the story. A spike is a story for research, such as the Look & Feel spike for UX.',video:'JiraTutorial1, around 15 to 25 min: the story map, then the Audio System epic and the Neo Core Audio System story with acceptance criteria and Definition of Done.',checks:()=>{const st=stories();return [['Create at least 2 epics',S.epics.length>=2],['Create at least 6 stories',st.length>=6],['Write a story as "As a… I want… so that…"',st.some(i=>STORY_RX.test(i.summary+' '+i.desc+' '))],['Give a story 2 or more acceptance criteria',st.some(i=>i.ac.length>=2)],['Link every story to an epic',st.length>0&&st.every(i=>i.epic)]]},fill:'backlog'},
  {t:'Refine and estimate',v:'backlog',body:`<p>Before sprint planning, the <b>Product Owner prioritises</b> the backlog by dragging items into order. In the video: the Look &amp; Feel spike first, then the Neo Core Audio System development.</p><p>At sprint planning the team estimates each story together in <b>story points</b> using the Fibonacci sequence (1, 2, 3, 5, 8, 13, 21, 40, 100; Jira teams often use 20 instead of 21). In the video the Look &amp; Feel spike is 5 points and Neo Core Audio System is 20. <b>Tasks don't get story points.</b> Planning poker here is a practice round of that group estimate.</p>`,tip:'In Jira: drag issues in the backlog to rank them, then type the estimate into each issue\'s Story Points field.',video:'JiraTutorial2, around 13 to 16 min: estimating with story points and planning poker.',checks:()=>[['Estimate at least 6 issues',S.issues.filter(i=>i.points).length>=6],['Run planning poker on a story (open a story)',!!S.flags.poker],['Reorder the backlog by dragging an issue',!!S.flags.reorder]],fill:'estimate'},
  {t:'Plan the sprint',v:'backlog',body:`<p>The release plan has <b>20 two-week sprints</b> and two <b>releases</b>: Release 1 (1 Jul – 4 Oct, the bare-bones Get In app) and Release 2 – MVP (7 Oct – 10 Apr, every feature). Create both in <b>Releases → Create version</b>, then set each issue's <b>Fix version</b>.</p><p>Create <b>VAS Sprint 1</b>, drag the top backlog items into it within the forecast, and <b>assign</b> each one: UX work to Brent, front-end development to Momenti. Start it with a two-week duration from 1 July and a goal: <i>Navigation Completion; Screen Saver Look &amp; Feel</i>.</p>`,tip:'In Jira: Releases → Create version (name, start date, release date, description). Backlog → Create sprint, drag issues in, then Start sprint: name, duration, start date, sprint goal.',video:'JiraTutorial2, from the start to about 4 min (release plan, Release 1 and Release 2 - MVP) and around 16 to 19 min (creating and starting VAS Sprint 1).',checks:()=>{const sp=S.sprints.find(s=>s.state!=='closed')||S.sprints[S.sprints.length-1];const items=sp?sprintIssues(sp.id):[];const f=forecast().val;const started=S.sprints.some(s=>s.state!=='future');return [['Create a sprint',S.sprints.length>0],['Put issues in the sprint, all estimated',started||(items.length>0&&items.every(i=>i.points||i.type==='task'))],['Stay within the forecast capacity',started?S.sprints.some(s=>s.state!=='future'&&s.committed<=Math.max(f,s.forecast||0)):(items.length>0&&sum(items)<=f)],['Start the sprint with a sprint goal',started]]},fill:'plan'},
  {t:'Run the sprint',v:'board',body:`<p>Once the sprint starts, its issues appear on the board in <b>Current Sprint Backlog</b> and move right through Design, Development, Unit Testing, QA and UAT to Done. Anything stuck goes to <b>Blocked</b>.</p><p>At the <b>daily stand-up</b> you go round the room, 3 to 5 minutes per person: what did you do, what's next, any blockers? Click each person's <b>quick filter</b> to see their work. Press <b>Next day</b> to run a day. Avoid adding work to a running sprint: Jira warns that sprint scope will be affected, and it changes the burndown and velocity.</p>`,tip:'In Jira: Active sprints → click a quick filter to see one person\'s cards. Dragging an issue into or out of a running sprint shows "Sprint scope will be affected by this action".',video:'JiraTutorial2, around 19 to 24 min (the board and quick filters) and JiraTutorial3 (adding a research spike mid-sprint, moving issues between sprint and backlog).',checks:()=>[['Move a card on the board yourself',!!S.flags.boardMove],['Hold 3 daily stand-ups (Next day)',(S.flags.days||0)>=3],['Remove a blocker as the Scrum Master',!!S.flags.unblock],['Decide what to do with an urgent new request',!!S.flags.scope]]},
  {t:'Review the sprint',v:'reports',body:`<p>When the timebox ends, <b>complete the sprint</b>. Unfinished items go back to the backlog or into the next sprint. They never count as done.</p><p>At the <b>sprint review</b> the team shows stakeholders what's done and collects feedback. The <b>sprint report</b>, <b>burndown</b> and <b>velocity</b> charts help explain what happened.</p>`,tip:'In Jira: "Complete sprint" at the top of the board, then Reports → Sprint report, Burndown chart, Velocity report.',video:'Not covered in the videos. This is the next step of the Scrum cycle.',checks:()=>[['Complete the sprint',closedSprints().length>=1],['Open the sprint report',!!S.flags.viewReport]]},
  {t:'Hold the retrospective',v:'retro',body:`<p>The <b>sprint retrospective</b> is about how the team worked, not what it built. Collect what went well and what to improve, vote for the most important points, and agree on one or two concrete <b>action items</b>.</p><p>Turn action items into backlog tasks so they actually happen in the next sprint.</p>`,tip:'Jira has no built-in retrospective board. Teams often use a Confluence retrospective page or a whiteboard, then create Jira tasks for the action items.',video:'Not covered in the videos.',checks:()=>{const r=c=>S.retro.some(n=>n.col===c);return [['Add something that went well',r('well')],['Add something to improve',r('improve')],['Vote on a note',S.retro.some(n=>n.votes>0)],['Add an action item and turn it into a backlog task',S.retro.some(n=>n.task)]]}},
  {t:'Start the next sprint',v:'backlog',body:`<p>Scrum is a loop. Plan sprint 2 with what you learned. Your forecast now uses the <b>real velocity</b> from sprint 1, and the backlog has changed: new requests, unfinished work and retro actions.</p><p>Run it, complete it, and compare both sprints in the velocity report.</p>`,tip:'Velocity usually settles after 3 or 4 sprints. Use it to forecast, never as a target or to compare teams.',video:'Not covered in the videos.',checks:()=>[['Start sprint 2',S.sprints.filter(s=>s.state!=='future').length>=2],['Complete sprint 2',closedSprints().length>=2],['Compare the sprints in the velocity report',!!S.flags.viewReport2]]}
];
const NAV=v=>`[data-nav=${v}]`;
const CHECKS=[
  ()=>[],
  ()=>{const x=S.site||{};return [['Create your account and site name',!!x.name,['.onb-acc input:placeholder-shown','[data-tour=su-next0]']],['Answer the welcome questions',!!(x.team&&x.role),['.onb .chips']],['Invite your team',!!x.inviteDone,['.onb input[type=email]:placeholder-shown','[data-tour=su-next3]']],['Answer the setup questions and pick Scrum',x.template==='scrum',['[data-tour=su-scrum]','.qs select.unset','[data-tour=su-next4]']]]},
  ()=>[['Create a project with the Scrum template',!!S.project,['#pj-name:placeholder-shown','[data-tour=create-project]']],['Delete the default To Do, In Progress and Done columns',!!S.project&&!S.columns.some(c=>c.dflt),['.cm-col[data-default] [data-tour=col-del]','[data-tour=bs-columns]','[data-tour=board-settings]',NAV('setup')]],['Add the 9 working-agreement columns in order',columnsDone(),['#col-name','[data-tour=bs-columns]','[data-tour=board-settings]',NAV('setup')]]],
  ()=>{const r=x=>S.team.filter(m=>m.role===x).length;const f=['#tm-name',NAV('team')];return [['Invite a Product Owner, a Scrum Master and 2+ Developers',r('Product Owner')>=1&&r('Scrum Master')>=1&&r('Developer')>=2,f],['Give team members their job titles',S.team.filter(m=>m.title).length>=3,['#tm-title',NAV('team')]],['Create a quick filter in JQL for a team member',S.qfs.some(q=>!q.builtin),['#qf-name:placeholder-shown','#qf-jql','[data-tour=bs-qf]','[data-tour=board-settings]',NAV('setup')]]]},
  ()=>{const st=stories();return [['Create at least 2 epics (Epic Name + Summary)',S.epics.length>=2,['#ci-epicName','[data-tour=ci-create]','[data-tour=create-epic]',NAV('backlog')]],['Create at least 6 stories',st.length>=6,['#ci-summary','[data-tour=create-issue]',NAV('backlog')]],['Write a story as "As a… I want… so that…"',st.some(i=>STORY_RX.test(i.summary+' '+i.desc+' ')),['#md-desc','#ni-sum',NAV('backlog')]],['Give a story acceptance criteria and a Definition of Done',st.some(i=>i.ac.length>=1&&(i.dod||'').trim()),['#ac-new','.irow[data-type=story]',NAV('backlog')]],['Link every story to an epic',st.length>0&&st.every(i=>i.epic),['[data-tour=epic-select]','.irow[data-noepic]',NAV('backlog')]]]},
  ()=>[['Estimate at least 6 stories (tasks get no points)',S.issues.filter(i=>i.points&&i.type!=='task').length>=6,['[data-tour=points]','.irow .fibrow','[data-tour=estimate]',NAV('backlog')]],['Run planning poker on a story (open a story)',!!S.flags.poker,['[data-tour=poker-act]','[data-tour=poker]','.irow[data-type=story]',NAV('backlog')]],['Reorder the backlog by dragging an issue',!!S.flags.reorder,['[data-sec=backlog] .irow ~ .irow .grip',NAV('backlog')]]],
  ()=>{const sp=S.sprints.find(s=>s.state!=='closed')||S.sprints[S.sprints.length-1];const items=sp?sprintIssues(sp.id):[];const f=forecast().val;const started=S.sprints.some(s=>s.state!=='future');return [['Create the versions Release 1 and Release 2 - MVP',['release 1','release 2 - mvp'].every(n=>S.releases.some(r=>r.name.toLowerCase()===n)),['#rl-name','[data-tour=create-version]',NAV('releases')]],['Create a sprint',S.sprints.length>0,['[data-tour=create-sprint]',NAV('backlog')]],['Put issues in the sprint, all estimated',started||(items.length>0&&items.every(i=>i.points||i.type==='task')),['[data-sec=backlog] .irow .grip',NAV('backlog')]],['Stay within the forecast capacity',started?S.sprints.some(s=>s.state!=='future'&&s.committed<=Math.max(f,s.forecast||0)):(items.length>0&&sum(items)<=f),['.cap',NAV('backlog')]],['Assign every sprint issue to someone',started||(items.length>0&&items.every(i=>i.assignee)),['[data-tour=assignee-select]','.irow',NAV('backlog')]],['Set Fix version to Release 1 on the sprint issues',items.length>0&&items.every(i=>i.fix),['[data-tour=fix-select]','.irow',NAV('backlog')]],['Start the sprint with a sprint goal',started,['#sp-goal','[data-tour=start-sprint]',NAV('backlog')]]]},
  ()=>[['Use a quick filter to see one person\'s work',!!S.flags.qfUsed,['.qf button',NAV('board')]],['Move a card on the board yourself',!!S.flags.boardMove,['.col.c-sprintbacklog .bcard','.col .bcard',NAV('board')]],['Hold 3 daily stand-ups (Next day)',(S.flags.days||0)>=3,['[data-tour=next-day]',NAV('board')]],['Remove a blocker as the Scrum Master',!!S.flags.unblock,['[data-tour=unblock]','.col.c-blocked .bcard','[data-tour=next-day]',NAV('board')]],['Decide what to do with an urgent new request',!!S.flags.scope,['.dialog .acts .btn','[data-tour=next-day]',NAV('board')]]],
  ()=>[['Complete the sprint',closedSprints().length>=1,['.dialog .btn.primary','[data-tour=complete]',NAV('board')]],['Open the sprint report',!!S.flags.viewReport,[NAV('reports')]]],
  ()=>{const r=c=>S.retro.some(n=>n.col===c);return [['Add something that went well',r('well'),['#rt-well',NAV('retro')]],['Add something to improve',r('improve'),['#rt-improve',NAV('retro')]],['Vote on a note',S.retro.some(n=>n.votes>0),['.vote',NAV('retro')]],['Add an action item and turn it into a backlog task',S.retro.some(n=>n.task),['[data-tour=retro-task]','#rt-action',NAV('retro')]]]},
  ()=>[['Start sprint 2',S.sprints.filter(s=>s.state!=='future').length>=2,['#sp-goal','[data-tour=start-sprint]','[data-tour=create-sprint]',NAV('backlog')]],['Complete sprint 2',closedSprints().length>=2,['.dialog .btn.primary','[data-tour=complete]','[data-tour=next-day]',NAV('board')]],['Compare the sprints in the velocity report',!!S.flags.viewReport2,[NAV('reports')]]]
];
STAGES.forEach((x,k)=>x.checks=CHECKS[k]);
const stageDone=i=>{const c=STAGES[i].checks();return c.length>0&&c.every(x=>x[1])};

/* ---------- actions ---------- */
const A={};
A.go=v=>{if(v==='boardsettings'&&!UI.bsTab)UI.bsTab='columns';if(v!=='setup'&&!S.project){toast('Create the project first.');return}S.view=v;if(v==='reports'){if(closedSprints().length)S.flags.viewReport=true;if(closedSprints().length>=2)S.flags.viewReport2=true}commit()};
A.stage=i=>{S.stage=Math.max(0,Math.min(STAGES.length-1,i));const v=STAGES[S.stage].v;if(v==='setup'||S.project)A.go(v);else commit()};
A.toggleLesson=()=>{S.lesson=!S.lesson;commit()};
A.toggleHints=()=>{S.hints=S.hints===false;commit()};
A.reset=()=>dialog('Reset the whole project?','<p>This deletes your project, team, backlog, sprints and retrospective in this browser and starts again from the beginning. It can\'t be undone.</p>',[{label:'Cancel'},{label:'Reset everything',kind:'primary',fn:()=>{S=fresh();UI.modal=null;UI.poker=null}}]);
A.fill=what=>{
  if(what==='site'||(!S.site&&what!=='site')){if(!S.site||!S.site.template){S.site={email:'nick.s@synthesiscorp.net',first:'Nick',last:'Stekovic',name:'vangelisautoshow',team:'Software Development',role:'Scrum Master',inviteDone:true,skippedInvite:true,newJira:'new to',newAgile:'new to',work:'features',schedule:'tight',template:'scrum'};S.onb=5;if(!S.team.some(m=>m.name==='Nick Stekovic'))S.team.push({id:uid(),name:'Nick Stekovic',role:'Scrum Master'});}S.view='setup'}
  if(what==='project'){if(!S.project)S.project={name:'Vangelis Auto Show',key:'VAS',template:'scrum',mgmt:'company'};if(!columnsDone())nineColumns();S.view='setup'}
  if(what==='team'){if(!S.project)A.fill('project');SAMPLE_TEAM.forEach(([n,r,t])=>{const m=S.team.find(m=>m.name===n);if(m){if(!m.title)m.title=t}else S.team.push({id:uid(),name:n,role:r,title:t})});SAMPLE_QF.forEach(([n,j,d])=>{if(!S.qfs.some(q=>q.name===n)){const m=qfMember(j);if(m)S.qfs.push({id:uid(),name:n,jql:j,desc:d,member:m.id})}});S.view='team'}
  if(what==='backlog'){if(!S.project)A.fill('project');if(!S.team.length)A.fill('team');ensureReleases();SAMPLE_EPICS.forEach(n=>{if(!S.epics.some(x=>x.name===n))S.epics.push({id:uid(),key:nextKey(),name:n,summary:EPIC_SUMMARY[n]||'',desc:'',color:EPIC_COLORS[S.epics.length%EPIC_COLORS.length]})});const eid=n=>(S.epics.find(x=>x.name===n)||{}).id||null;SAMPLE_ITEMS.forEach(([en,type,summary,size,p,ac,dod,fix,desc,who,labels])=>{if(!S.issues.some(i=>i.summary===summary)){const m=S.team.find(t=>t.name===who);newIssue({type,summary,size,prio:p,ac:ac.slice(),dod:dod||'',fix:fix||null,desc:desc||'',epic:eid(en),assignee:m?m.id:null,labels:labels||''})}});S.view='backlog'}
  if(what==='estimate'){S.issues.forEach(i=>{if(!i.points&&i.type!=='task')i.points=i.size||3});S.view='backlog'}
  if(what==='plan'){ensureReleases();let sp=S.sprints.find(s=>s.state==='future');if(!sp)sp=makeSprint();if(!sp.goal)sp.goal='Navigation Completion; Screen Saver Look & Feel';const f=forecast().val;let total=sum(sprintIssues(sp.id));for(const i of backlogIssues()){if(i.status==='done')continue;const p=i.type==='task'?0:(i.points||i.size||3);if(total+p>f)continue;if(i.type!=='task')i.points=i.points||p;i.sprint=sp.id;if(!i.fix)i.fix='Release 1';total+=p}const D=devs();sprintIssues(sp.id).forEach((i,n)=>{if(!i.assignee&&D.length)i.assignee=D[n%D.length].id});S.view='backlog'}
  toast('Sample data from the Vangelis Auto Show project added. Change anything you like.');commit()
};
A.pickTpl=t=>{UI.tpl=t;render()};
A.pickMgmt=m=>{UI.mgmt=m;render()};
A.keyFromName=v=>{const el=document.getElementById('pj-key');if(el&&!el.dataset.touched){const words=v.trim().split(/\s+/).filter(Boolean);let k=words.length>1?words.map(w=>w[0]).join(''):v.replace(/[^a-z]/gi,'').slice(0,3);el.value=k.toUpperCase().replace(/[^A-Z]/g,'').slice(0,5)}};
A.createProject=()=>{const name=val('pj-name').trim(),key=val('pj-key').trim().toUpperCase().replace(/[^A-Z]/g,'');if(UI.tpl!=='scrum'){toast('This course uses Scrum. Kanban has no sprints, so choose the Scrum template.');return}if(!name){toast('Give the project a name.');return}if(key.length<2){toast('The key needs at least 2 letters, for example FC.');return}S.project={name,key,template:'scrum',mgmt:UI.mgmt};toast(`Project ${name} created. Issues will be numbered ${key}-1, ${key}-2…`);commit()};
A.addRelease=()=>{const v=val('rl-name').trim();if(!v){toast('Give the version a name, e.g. Release 3.');return}if(!S.releases.some(r=>r.name===v))S.releases.push({name:v,start:val('rl-start'),end:val('rl-end'),desc:val('rl-desc').trim()});commit()};
A.delRelease=k=>{const r=S.releases[k].name;S.releases.splice(k,1);S.issues.forEach(i=>{if(i.fix===r)i.fix=null});commit()};
function qfMember(jql){const m=/^\s*assignee\s*=\s*["']?([^"']+?)["']?\s*$/i.exec(jql||'');if(!m)return null;const q=m[1].trim().toLowerCase();return S.team.find(t=>t.name.toLowerCase()===q)||S.team.find(t=>t.name.toLowerCase().split(' ')[0]===q)||null}
A.addQF=()=>{const n=val('qf-name').trim(),j=val('qf-jql').trim(),d=val('qf-desc').trim();if(!n){toast('Give the quick filter a name, e.g. Sandra Price.');return}if(!/^\s*assignee\s*=/i.test(j)){UI.qfErr='Write the JQL as: assignee = "Sandra Price"';render();return}const m=qfMember(j);if(!m){const who=(/=\s*["']?([^"']+?)["']?\s*$/.exec(j)||[,''])[1];UI.qfErr=`The user "${who}" doesn't exist. Invite them on the Team page first, then add the filter.`;render();return}UI.qfErr=null;S.qfs.push({id:uid(),name:n,jql:j,desc:d||'All tasks for '+m.name,member:m.id});toast(`Quick filter "${n}" added. It now shows on the board.`);commit()};
A.delQF=id=>{S.qfs=S.qfs.filter(q=>q.id!==id);if(UI.qf===id)UI.qf=null;commit()};
A.renameProject=v=>{if(v.trim()){S.project.name=v.trim();commit()}};
A.addMember=()=>{const n=val('tm-name').trim();if(!n){toast('Type a name first.');return}S.team.push({id:uid(),name:n,role:val('tm-role'),title:val('tm-title').trim()});toast(n+' invited to the site.');commit();setTimeout(()=>{const el=document.getElementById('tm-name');if(el)el.focus()},0)};
A.setRole=(id,r)=>{member(id).role=r;commit()};
A.setTitle=(id,t)=>{member(id).title=t;commit()};
A.removeMember=id=>{S.team=S.team.filter(m=>m.id!==id);S.issues.forEach(i=>{if(i.assignee===id)i.assignee=null});commit()};
A.openCreate=(type)=>{UI.create={type:type||'story',summary:'',desc:'',epicName:'',assignee:'',prio:'Medium',labels:'',epic:S.filterEpic||'',sprint:'',fix:'',another:false};render();setTimeout(()=>{const e=document.getElementById(type==='epic'?'ci-epicname':'ci-sum');if(e)e.focus()},0)};
function readCI(){const c=UI.create;['summary','desc','epicName','assignee','prio','labels','epic','sprint','fix'].forEach(f=>{const e=document.getElementById('ci-'+f);if(e)c[f]=e.value});const a=document.getElementById('ci-another');if(a)c.another=a.checked;return c}
A.ciType=v=>{readCI();UI.create.type=v;render()};
A.ciClose=()=>{UI.create=null;render()};
A.ciSubmit=()=>{const c=readCI();if(!c.summary.trim()){toast('Summary is required.');return}
  if(c.type==='epic'){if(!c.epicName.trim()){toast('Epic Name is required: a short name to identify the epic.');return}if(S.epics.some(e=>e.name.toLowerCase()===c.epicName.trim().toLowerCase())){toast('An epic with that name exists.');return}const e={id:uid(),key:nextKey(),name:c.epicName.trim(),summary:c.summary.trim(),desc:c.desc,color:EPIC_COLORS[S.epics.length%EPIC_COLORS.length]};S.epics.push(e);toast(`${e.key} ${e.name} created.`)}
  else{const i=newIssue({type:c.type,summary:c.summary.trim(),desc:c.desc,assignee:c.assignee||null,prio:c.prio,labels:c.labels,epic:c.epic||null,fix:c.fix||null,size:c.type==='task'?2:[2,3,5,5,8][Math.floor(Math.random()*5)]});toast(`${i.key} created.`);if(c.sprint){const sp=sprintOf(c.sprint);if(sp&&sp.state==='active'){const keep=c.another;UI.create=keep?Object.assign(c,{summary:'',desc:''}):null;return scopeGuard(i,c.sprint)}moveIssue(i,c.sprint)}}
  if(c.another){Object.assign(c,{summary:'',desc:'',epicName:''});commit();setTimeout(()=>{const e=document.getElementById(c.type==='epic'?'ci-epicname':'ci-sum');if(e)e.focus()},0)}else{UI.create=null;commit()}};
function createHTML(){const c=UI.create;const o=(list,cur)=>list.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('');const ep=c.type==='epic';
  return `<div class="overlay" style="z-index:25" onclick="if(event.target===this)A.ciClose()"><div class="dialog" style="width:min(640px,100%)" role="dialog" aria-modal="true" aria-label="Create issue"><div class="row-flex" style="justify-content:space-between"><h2>Create issue</h2></div>
  <label class="f">Project<input value="${esc(S.project.name)} (${esc(S.project.key)})" disabled></label>
  <label class="f" for="ci-type">Issue Type<select id="ci-type" style="max-width:240px" onchange="A.ciType(this.value)">${o([['story','Story'],['task','Task'],['bug','Bug'],['epic','Epic']],c.type)}</select></label>
  ${ep?`<label class="f" for="ci-epicName">Epic Name <span class="hint">A short name to identify this epic, e.g. Audio System</span><input id="ci-epicName" value="${esc(c.epicName)}"></label>`:''}
  <label class="f" for="ci-summary">Summary<input id="ci-summary" value="${esc(c.summary)}" placeholder="${ep?'As a user, I would like to…':'As a Neo vehicle enthusiast, I would like … so that …'}"></label>
  <label class="f" for="ci-desc">Description <span class="hint">${ep?'':'Story, then *ACCEPTANCE CRITERIA* and *DEFINITION OF DONE*'}</span><textarea id="ci-desc">${esc(c.desc)}</textarea></label>
  ${ep?'':`<div class="grid2" style="gap:10px">
    <label class="f" for="ci-assignee">Assignee<select id="ci-assignee">${o([['','Unassigned'],...S.team.filter(m=>m.role!=='Stakeholder').map(m=>[m.id,m.name])],c.assignee)}</select></label>
    <label class="f" for="ci-prio">Priority<select id="ci-prio">${o(PRIOS.map(x=>[x,x]),c.prio)}</select></label>
    <label class="f" for="ci-labels">Labels<input id="ci-labels" value="${esc(c.labels)}" placeholder="e.g. Audio System"></label>
    <label class="f" for="ci-epic">Epic Link<select id="ci-epic">${o([['','None'],...S.epics.map(e=>[e.id,e.name])],c.epic)}</select></label>
    <label class="f" for="ci-sprint">Sprint<select id="ci-sprint">${o([['','None (Backlog)'],...S.sprints.filter(x=>x.state!=='closed').map(x=>[x.id,x.name+(x.state==='active'?' (active)':'')])],c.sprint)}</select></label>
    <label class="f" for="ci-fix">Fix Version<select id="ci-fix">${o([['','None'],...S.releases.map(r=>[r.name,r.name])],c.fix)}</select></label></div>`}
  <div class="acts" style="align-items:center"><label class="row-flex" style="margin-right:auto;font-size:14px;flex-wrap:nowrap"><input id="ci-another" type="checkbox" style="width:auto" ${c.another?'checked':''}>Create another</label><button class="btn" onclick="A.ciClose()">Cancel</button><button class="btn primary" data-tour="ci-create" onclick="A.ciSubmit()">Create</button></div></div></div>`}
A.addEpic=()=>{const n=val('ep-name').trim();if(!n){toast('Type an epic name first.');return}S.epics.push({id:uid(),key:nextKey(),name:n,desc:'',color:EPIC_COLORS[S.epics.length%EPIC_COLORS.length]});commit()};
A.filterEpic=id=>{S.filterEpic=S.filterEpic===id?null:id;commit()};
A.createIssue=()=>{const s=val('ni-sum').trim();if(!s){toast('Type a summary first.');return}const type=val('ni-type');newIssue({type,summary:s,epic:S.filterEpic||null,size:[2,3,5,5,8][Math.floor(Math.random()*5)]});UI.newType=type;commit();setTimeout(()=>{const el=document.getElementById('ni-sum');if(el)el.focus()},0)};
A.toggleEstimate=()=>{UI.estimate=!UI.estimate;render()};
A.quickPts=(e,id,v)=>{e.stopPropagation();const i=byId(id);i.points=i.points===v?null:v;commit()};
A.open=id=>{UI.modal=id;UI.poker=null;render()};
A.close=()=>{UI.modal=null;UI.poker=null;commit()};
A.set=(id,f,v)=>{const i=byId(id);if(f==='type'&&v==='task')i.points=null;if(f==='summary'&&!v.trim())return;if(f==='sprint'){return scopeGuard(i,v||null)}if(f==='status'){setStatus(i,v);if(activeSprint()&&i.sprint===activeSprint().id)S.flags.boardMove=true}else if(f==='assignee'||f==='epic'||f==='fix'){i[f]=v||null}else i[f]=v;commit()};
A.setPts=(id,v)=>{const i=byId(id);i.points=i.points===v?null:v;commit()};
A.storyTpl=id=>{const i=byId(id);if(!STORY_RX.test(i.summary+' '+i.desc+' ')){i.summary='As a [role], I would like [goal] so that [why]'}commit();setTimeout(()=>{const el=document.getElementById('md-sum');if(el){el.focus();el.select()}},0)};
A.addAC=id=>{const v=val('ac-new').trim();if(!v)return;byId(id).ac.push(v);commit();setTimeout(()=>{const el=document.getElementById('ac-new');if(el)el.focus()},0)};
A.delAC=(id,k)=>{byId(id).ac.splice(k,1);commit()};
A.addSub=id=>{const v=val('st-new').trim();if(!v)return;byId(id).subtasks.push({id:uid(),t:v,done:false});commit();setTimeout(()=>{const el=document.getElementById('st-new');if(el)el.focus()},0)};
A.togSub=(id,k)=>{const s=byId(id).subtasks[k];s.done=!s.done;commit()};
A.delSub=(id,k)=>{byId(id).subtasks.splice(k,1);commit()};
A.unblock=id=>{const i=byId(id);i.blocked=null;if(i.status==='blocked')i.status=i.prevStatus&&i.prevStatus!=='blocked'?i.prevStatus:'development';S.flags.unblock=true;toast('Blocker removed. Removing impediments is a core Scrum Master job.');commit()};
A.flag=id=>{const i=byId(id);setStatus(i,'blocked');commit()};
A.delIssue=id=>{const i=byId(id);dialog('Delete '+i.key+'?',`<p>"${esc(i.summary)}" will be removed for good.</p>`,[{label:'Cancel'},{label:'Delete',kind:'primary',fn:()=>{S.issues=S.issues.filter(x=>x.id!==id);UI.modal=null}}])};

/* planning poker */
A.poker=id=>{const i=byId(id);const D=devs();if(D.length<2){toast('Planning poker needs at least 2 Developers on the Team page.');return}const size=i.size||3;UI.poker={id,round:1,revealed:false,votes:D.map(d=>({who:d.name,v:vote(size,1)}))};render()};
function vote(size,round){let k=FIB.indexOf(size);if(k<0)k=2;const r=Math.random();let d=0;if(round===1){if(r<.2)d=-2;else if(r<.4)d=-1;else if(r<.6)d=1;else if(r<.72)d=2}else{if(r<.15)d=-1;else if(r<.3)d=1}return FIB[Math.max(0,Math.min(FIB.length-1,k+d))]}
A.reveal=()=>{UI.poker.revealed=true;render()};
A.revote=()=>{const p=UI.poker;const i=byId(p.id);p.round++;p.revealed=false;p.votes=p.votes.map(x=>({who:x.who,v:vote(i.size||3,2)}));render()};
A.agree=v=>{const i=byId(UI.poker.id);i.points=v;S.flags.poker=true;UI.poker=null;toast(`${i.key} estimated at ${v} points.`);commit()};

/* drag and drop */
A.dragStart=(e,id)=>{UI.drag=id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',id)}catch(_){}};
A.over=e=>{e.preventDefault();const t=e.currentTarget;t.classList.add(t.classList.contains('irow')?'drag-over':'dropping')};
A.leave=e=>{e.currentTarget.classList.remove('drag-over','dropping')};
A.dropRow=(e,targetId)=>{e.preventDefault();e.stopPropagation();const id=UI.drag;UI.drag=null;if(!id||id===targetId)return render();const i=byId(id),t=byId(targetId);const dest=t.sprint||null;const moved=(i.sprint||null)!==dest;const fa=i.sprint&&sprintOf(i.sprint).state==='active',ta=dest&&sprintOf(dest).state==='active';if(moved&&(fa||ta))return scopeGuard(i,dest,()=>{i.rank=maxRank()+1});moveIssue(i,dest);const list=S.issues.filter(x=>(x.sprint||null)===dest&&x.id!==i.id).sort(byRank);const k=list.indexOf(t);list.splice(k,0,i);const base=list.length?Math.min(...list.map(x=>x.rank)):0;list.forEach((x,n)=>x.rank=base+n*0.001+ (n));if(!moved)S.flags.reorder=true;normalizeRanks();commit()};
A.dropSection=(e,dest)=>{e.preventDefault();const id=UI.drag;UI.drag=null;if(!id)return render();const i=byId(id);const d=dest==='backlog'?null:dest;if((i.sprint||null)!==d){return scopeGuard(i,d,()=>{i.rank=maxRank()+1})}commit()};
A.dropCol=(e,k)=>{e.preventDefault();const id=UI.drag;UI.drag=null;if(!id)return render();const i=byId(id);const c=S.columns[k];if(!c||!c.statuses.length)return render();if(c.statuses.includes(i.status))return render();const status=c.statuses.includes('sprintbacklog')?'sprintbacklog':c.statuses[0];if(i.status!==status){setStatus(i,status);S.flags.boardMove=true;if(status==='blocked')toast(i.key+' moved to Blocked. The Scrum Master should help remove the impediment.')}commit()};
function normalizeRanks(){S.issues.slice().sort(byRank).forEach((x,n)=>x.rank=n+1)}
function scopeGuard(i,dest,after){const from=i.sprint?sprintOf(i.sprint):null,to=dest?sprintOf(dest):null;const touches=(from&&from.state==='active')||(to&&to.state==='active');if(!touches||(from&&to&&from.id===to.id)){moveIssue(i,dest);after&&after();return commit()}
  dialog('Sprint scope will be affected',`<p>${to&&to.state==='active'?`Adding <b>${i.key}</b> to the running sprint`:`Removing <b>${i.key}</b> from the running sprint`} changes the scope the team committed to at sprint planning.</p><p>Jira tracks the sprint from the moment it started, so this shows up in the burndown and can distort the team's velocity. As a rule, don't add work to a running sprint; put it in the backlog for the next sprint planning.</p>`,[{label:'Cancel'},{label:'Change scope anyway',kind:'primary',fn:()=>{moveIssue(i,dest);after&&after()}}])}
function moveIssue(i,dest){const from=i.sprint?sprintOf(i.sprint):null;const to=dest?sprintOf(dest):null;if(from&&from.state==='closed'){toast('That issue belongs to a closed sprint.');return}if(to&&to.state==='closed')return;if(to&&to.state==='active'&&!(from&&from.id===to.id)){to.scopeAdded=(to.scopeAdded||0)+pts(i);i.mid=true;to.changes=(to.changes||[]);to.changes.push({day:to.day,delta:pts(i)});if(i.status==='backlog')i.status='sprintbacklog';toast(`${i.key} added to the active sprint. That changes the scope the team committed to.`)}if(from&&from.state==='active'&&!(to&&to.id===from.id)){from.changes=(from.changes||[]);from.changes.push({day:from.day,delta:-pts(i)})}i.sprint=dest}

/* sprints */
function makeSprint(){const n=S.sprints.length+1;const prev=S.sprints[S.sprints.length-1];const sp={id:uid(),name:`${S.project.key} Sprint ${n}`,goal:'',length:10,weeks:2,start:prev&&prev.start?addDays(prev.start,(prev.weeks||2)*7):'2019-07-01',state:'future',day:0,burn:[],committed:0,completed:0,scopeAdded:0,changes:[],standup:null};S.sprints.push(sp);return sp}
A.createSprint=()=>{makeSprint();toast('Sprint created. Drag issues from the backlog into it.');commit()};
A.editSprint=id=>{const sp=sprintOf(id);dialog('Edit sprint',sprintFields(sp),[{label:'Cancel'},{label:'Save',kind:'primary',fn:()=>readSprintFields(sp)}])};
A.delSprint=id=>{const sp=sprintOf(id);dialog('Delete '+sp.name+'?','<p>Its issues go back to the backlog.</p>',[{label:'Cancel'},{label:'Delete sprint',kind:'primary',fn:()=>{S.issues.forEach(i=>{if(i.sprint===id)i.sprint=null});S.sprints=S.sprints.filter(s=>s.id!==id)}}])};
function sprintFields(sp){const w=sp.weeks||2;return `<label class="f">Sprint name<input id="sp-name" value="${esc(sp.name)}"></label><div class="row-flex" style="flex-wrap:nowrap"><label class="f" style="flex:1">Duration<select id="sp-len" onchange="A.spEnd()">${[1,2,3,4].map(n=>`<option value="${n}" ${n===w?'selected':''}>${n} week${n>1?'s':''}</option>`).join('')}</select></label><label class="f" style="flex:1">Start date<input id="sp-start" type="date" value="${esc(sp.start||'')}" onchange="A.spEnd()"></label><label class="f" style="flex:1">End date<input id="sp-end" type="date" value="${esc(sp.start?addDays(sp.start,w*7):'')}" disabled></label></div><label class="f">Sprint goal <span class="hint">e.g. Navigation Completion; Screen Saver Look &amp; Feel</span><textarea id="sp-goal" placeholder="Navigation Completion; Screen Saver Look &amp; Feel">${esc(sp.goal)}</textarea></label>`}
A.spEnd=()=>{const st=val('sp-start'),w=+val('sp-len')||2;const e=document.getElementById('sp-end');if(e)e.value=st?addDays(st,w*7):''};
function readSprintFields(sp){sp.name=val('sp-name').trim()||sp.name;sp.goal=val('sp-goal').trim();sp.weeks=+val('sp-len')||2;sp.length=sp.weeks*5;sp.start=val('sp-start')||sp.start}

A.askStart=id=>{const sp=sprintOf(id);if(activeSprint()){toast('Another sprint is already running. Complete it first.');return}const items=sprintIssues(id);if(!items.length){toast('Drag some issues into the sprint first.');return}const f=forecast();const total=sum(items);const unest=items.filter(i=>!i.points&&i.type!=='task');let warn='';if(unest.length)warn+=`<div class="note-bad">${unest.length} issue${unest.length>1?'s are':' is'} not estimated (${unest.map(i=>i.key).join(', ')}). The team can't tell if it fits. Estimate them first.</div>`;if(total>f.val)warn+=`<div class="note-warn">You're committing to <b>${total}</b> points, but the forecast is <b>${f.val}</b> (${f.why}). An overloaded sprint usually ends with unfinished work.</div>`;const big=items.filter(i=>(i.points||0)>=13);if(big.length)warn+=`<div class="note-warn">${big.map(i=>i.key).join(', ')} ${big.length>1?'are':'is'} 13+ points. Stories that big rarely finish in one sprint; consider splitting.</div>`;
  dialog('Start sprint',`<p><b>${items.length}</b> issues will be included in this sprint (${total} points; forecast ${f.val}).</p>${warn}${sprintFields(sp)}`,[{label:'Cancel'},{label:'Start',kind:'primary',fn:()=>{readSprintFields(sp);if(!sp.goal){toast('Add a sprint goal. It keeps the team focused when plans change.');return false}if(unest.length){toast('Estimate every issue before starting.');return false}sprintIssues(sp.id).forEach(i=>{if(i.status==='backlog')i.status='sprintbacklog'});sp.state='active';sp.day=0;sp.committed=sum(sprintIssues(sp.id));sp.forecast=f.val;sp.burn=[sp.committed];sp.scopeAdded=0;sp.changes=[];sp.evBlock=false;sp.evScope=false;S.view='board';toast(sp.name+' started. Day 0: time for the first Daily Scrum.')}}])};
A.nextDay=()=>{const sp=activeSprint();if(!sp)return;if(sp.day>=sp.length){toast('The sprint timebox is over. Complete the sprint.');return}const D=devs();if(!D.length){toast('Add Developers on the Team page first.');return}
  const items=sprintIssues(sp.id);const lines=[];const before=new Map(items.map(i=>[i.id,i.status]));
  const signed=items.filter(i=>i.status==='uat');signed.forEach(i=>i.status='done');
  const passed=items.filter(i=>i.status==='qa');passed.forEach(i=>i.status='uat');
  const phase=(i)=>{const need=i.points||i.size||3;const f=(i.progress||0)/need;return f<.2?'design':(f<.7?'development':(f<1?'unittesting':'qa'))};
  D.forEach(d=>{const y=[];let t='';let b='None';
    const fin=signed.filter(i=>i.assignee===d.id);if(fin.length)y.push(`${fin.map(i=>i.key).join(', ')} signed off in UAT (Done)`);
    const qa=passed.filter(i=>i.assignee===d.id);if(qa.length)y.push(`${qa.map(i=>i.key).join(', ')} passed QA`);
    let cur=items.find(i=>i.assignee===d.id&&WORKING.includes(i.status));
    if(!cur){cur=items.find(i=>WORKING.includes(i.status)&&!i.assignee)||items.find(i=>i.status==='sprintbacklog'&&i.assignee===d.id)||items.find(i=>i.status==='sprintbacklog'&&!i.assignee)||items.find(i=>i.status==='sprintbacklog');if(cur&&cur.assignee&&cur.assignee!==d.id){const o=member(cur.assignee);y.push(`took over ${cur.key} from ${o?o.name.split(' ')[0]:'a teammate'}, who is busy`)}if(cur){cur.assignee=d.id;if(cur.status==='sprintbacklog')cur.status='design';y.push(`picked up ${cur.key}`)}}
    if(cur){const need=cur.points||cur.size||3;const before=cur.status;cur.progress=(cur.progress||0)+0.6+Math.random()*0.7;const ph=phase(cur);if(ph!==before&&WORKING.indexOf(ph)>WORKING.indexOf(before)||ph==='qa')cur.status=ph;
      if(cur.status==='qa'){y.push(`finished unit testing on ${cur.key}, handed to QA`);t='Pick up the next item from the Current Sprint Backlog'}
      else{y.push(`worked on ${cur.key} (${statusLabel(before)})`);t=`${statusLabel(cur.status)} on ${cur.key} (${Math.min(95,Math.round(100*cur.progress/need))}%)`}}
    else{const sw=items.filter(i=>WORKING.includes(i.status)&&i.assignee!==d.id).sort((x,z)=>((z.points||z.size||3)-(z.progress||0))-((x.points||x.size||3)-(x.progress||0)))[0];
      if(sw){const need=sw.points||sw.size||3;sw.progress=(sw.progress||0)+0.5+Math.random()*0.6;const ph=phase(sw);if(ph==='qa'||WORKING.indexOf(ph)>WORKING.indexOf(sw.status))sw.status=ph;const ow=member(sw.assignee);y.push(`paired with ${ow?ow.name.split(' ')[0]:'the team'} on ${sw.key}`);t=`Keep swarming on ${sw.key} (${Math.min(100,Math.round(100*sw.progress/need))}%)`}
      else{y.push('helped with QA and reviews');t='Help teammates finish what\'s in progress'}}
    const bl=items.find(i=>i.assignee===d.id&&i.status==='blocked');if(bl)b=`${bl.key}: ${bl.blocked}`;
    lines.push({who:d.name,y:y.join('; ')||'—',t,b})});
  sp.day++;items.forEach(i=>{if(before.get(i.id)!==i.status)i.updDay=sp.day});sp.burn[sp.day]=remaining(sp);sp.standup={day:sp.day,lines};S.flags.days=(S.flags.days||0)+1;
  let ev=null;
  if(!sp.evBlock&&sp.day>=2){const c=items.find(i=>WORKING.includes(i.status));if(c){c.prevStatus=c.status;c.status='blocked';c.blocked=BLOCKERS[Math.floor(Math.random()*BLOCKERS.length)];sp.evBlock=true;ev=()=>toast(`Blocker! ${c.key} moved to Blocked: ${c.blocked}. Open the card to remove it.`)}}
  if(!ev&&!sp.evScope&&sp.day>=4){sp.evScope=true;const r=REQUESTS[closedSprints().length%REQUESTS.length];const bug=newIssue({type:'bug',summary:r[0],desc:r[1],prio:'Highest',points:3,size:3,rank:minRank()-1,fix:'Release 1'});ev=()=>scopeDialog(bug,sp)}
  commit();if(ev)ev();else if(sp.day>=sp.length)toast('Last day of the sprint. Time to complete it.');};
function scopeDialog(bug,sp){const stake=S.team.find(m=>m.role==='Stakeholder')||{name:'The Vangelis event manager'};const po=S.team.find(m=>m.role==='Product Owner');dialog('Urgent request from a stakeholder',`<p><b>${esc(stake?stake.name:'A stakeholder')}</b>: "${esc(bug.summary)}." ${esc(bug.desc)}</p><p>${bug.key} has been created as a 3-point bug. The sprint is on day ${sp.day} of ${sp.length}. What does ${esc(po?po.name+' (Product Owner)':'the Product Owner')} decide?</p><div class="note-warn">There's no single right answer. Adding work mid-sprint changes the scope the team committed to; if you add it, consider taking something else out. A real production crash is a common reason to do it anyway.</div>`,[{label:'Put it at the top of the backlog',fn:()=>{S.flags.scope=true;toast(`${bug.key} is at the top of the backlog for the next sprint planning.`)}},{label:'Add it to the current sprint',kind:'primary',fn:()=>{S.flags.scope=true;moveIssue(bug,sp.id);bug.rank=minRank()-1}}])}
A.askComplete=()=>{const sp=activeSprint();if(!sp)return;const items=sprintIssues(sp.id);const done=items.filter(i=>i.status==='done'),open=items.filter(i=>i.status!=='done');const future=S.sprints.find(s=>s.state==='future');
  dialog('Complete '+sp.name,`<div class="stats"><div class="stat"><b>${done.length}</b><span>issues done</span></div><div class="stat"><b>${sum(done)}</b><span>points done (velocity)</span></div><div class="stat"><b>${open.length}</b><span>not done</span></div></div>${sp.day<sp.length?`<div class="note-warn">There ${sp.length-sp.day===1?'is':'are'} still ${sp.length-sp.day} day${sp.length-sp.day===1?'':'s'} left. Sprints normally run their full timebox.</div>`:''}${open.length?`<p>Unfinished issues don't count toward velocity:</p><ul>${open.map(i=>`<li>${i.key} ${esc(i.summary)} <span class="muted">(${pts(i)} pts, ${statusLabel(i.status)})</span></li>`).join('')}</ul><label class="f">Move unfinished issues to<select id="cs-dest"><option value="">Top of the backlog</option>${future?`<option value="${future.id}">${esc(future.name)}</option>`:''}<option value="new">A new sprint</option></select></label>`:'<p>Everything is done. Great sprint.</p>'}`,[{label:'Cancel'},{label:'Complete sprint',kind:'primary',fn:()=>{let dest=val('cs-dest')||null;if(dest==='new')dest=makeSprint().id;sp.burn[sp.day]=remaining(sp);sp.completed=sum(done);sp.doneKeys=done.map(i=>i.key);sp.openKeys=open.map(i=>i.key);sp.state='closed';const top=minRank();open.forEach((i,n)=>{i.sprint=dest;i.mid=false;if(!dest)i.rank=top-open.length+n});S.reportSprint=sp.id;S.retroSprint=sp.id;S.view='reports';S.flags.viewReport=true;if(closedSprints().length>=2)S.flags.viewReport2=true;toast(`${sp.name} completed with ${sp.completed} points. Next: sprint review, then the retrospective.`)}}])};
A.reportSprint=id=>{S.reportSprint=id;commit()};
A.retroSprint=id=>{S.retroSprint=id;commit()};
A.addRetro=col=>{const v=val('rt-'+col).trim();if(!v)return;const sid=S.retroSprint||(closedSprints().slice(-1)[0]||{}).id;S.retro.push({id:uid(),sprint:sid,col,text:v,votes:0,task:null});commit();setTimeout(()=>{const el=document.getElementById('rt-'+col);if(el)el.focus()},0)};
A.voteRetro=id=>{const n=S.retro.find(x=>x.id===id);n.votes++;commit()};
A.delRetro=id=>{S.retro=S.retro.filter(x=>x.id!==id);commit()};
A.retroTask=id=>{const n=S.retro.find(x=>x.id===id);const i=newIssue({type:'task',summary:n.text,prio:'High',size:2,rank:minRank()-1,desc:'Action item from the retrospective.'});n.task=i.key;toast(`${i.key} created at the top of the backlog.`);commit()};

function navBtn(v,label){return `<button data-nav="${v}" class="nav ${S.view===v?'on':''}" onclick="A.go('${v}')" ${v!=='setup'&&!S.project?'disabled':''}>${ICON[v]}${label}</button>`}
function view(){if(!S.project&&S.view!=='setup')S.view='setup';switch(S.view){case'setup':return setupView();case'team':return teamView();case'backlog':return backlogView();case'board':return boardView();case'reports':return reportsView();case'retro':return retroView();case'issues':return issuesView();case'boardsettings':return boardSettingsView();case'releases':return releasesView()}return''}

function lesson(){const st=STAGES[S.stage];const checks=st.checks();
  return `<div class="eyebrow">Lesson · step ${S.stage} of ${STAGES.length-1}</div>
  <div class="steps">${STAGES.map((x,k)=>`<button class="step ${k===S.stage?'on':''} ${stageDone(k)?'ok':''}" onclick="A.stage(${k})"><span class="dot">${stageDone(k)?'✓':k}</span>${esc(x.t)}</button>`).join('')}</div>
  <h2>${esc(st.t)}</h2>
  <div class="lbody">${st.body}</div>
  ${checks.length?`<div class="eyebrow" style="margin-top:14px">Your tasks</div><div class="tasks">${checks.map((c,k)=>`<div class="task ${c[1]?'ok':''}"><span class="box">${c[1]?'✓':`<span class="tnum">${k+1}</span>`}</span><span>${c[0]}</span></div>`).join('')}</div>`:''}
  <div class="tip"><b>In real Jira</b>${st.tip}</div>${st.video?`<div class="tip" style="margin-top:8px;border-left-color:var(--accent)"><b style="color:var(--accent)">In the videos</b>${st.video}</div>`:''}
  <div class="lnav">
    ${S.stage>0?`<button class="btn" onclick="A.stage(${S.stage-1})">Back</button>`:''}
    ${S.stage<STAGES.length-1?`<button class="btn primary" data-tour="next-stage" onclick="A.stage(${S.stage+1})">${S.stage===0?'Start':'Next step'}</button>`:''}
    ${st.fill?`<button class="btn ghost" onclick="A.fill('${st.fill}')" title="For demos: fills this step with example data">Fill with sample data</button>`:''}
  </div>`}

const TEAMS=['Customer Service','Finance','Operations','IT Support','Sales','Legal','Software Development','Marketing','Human Resources','Other'];
const JOBS=['DevOps','Software Engineer','Web Developer','QA Engineer','Project Manager','Designer','QA Manager','Development Manager','Product Manager','Other'];
const TPLS={scrum:['Scrum','Plan and track stories, tasks and workflows for a Scrum team. For teams that deliver work on a regular schedule.'],kanban:['Kanban','Move issues across a board and limit work in progress. For teams that pull work continuously from a backlog.'],bug:['Bug tracking','Keep a list of development tasks and bugs. For teams that don\'t need a board.']};

A.signup=()=>{const em=val('su-email').trim(),f=val('su-first').trim(),l=val('su-last').trim(),site=val('su-site').trim().toLowerCase().replace(/[^a-z0-9-]/g,'');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Enter a valid email address.');return}if(!f||!l){toast('Enter your first and last name.');return}if(site.length<3){toast('Choose a site name of at least 3 letters, e.g. vangelisautoshow.');return}S.site=Object.assign(S.site||{},{email:em,first:f,last:l,name:site});const full=f+' '+l;if(!S.team.some(m=>m.name===full))S.team.push({id:uid(),name:full,role:'Scrum Master'});S.onb=1;toast(`Your site ${site}.atlassian.net is ready. You are its admin.`);commit()};

const nameFromEmail=e=>e.split('@')[0].split(/[._-]+/).filter(w=>/^[a-z]+$/i.test(w)&&w.toLowerCase()!=='vangelis').slice(0,2).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' ')||e.split('@')[0];
A.invite=skip=>{let n=0;if(!skip){[1,2,3].forEach(k=>{const e=val('su-inv'+k).trim();if(!e)return;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){return}const name=nameFromEmail(e);if(!S.team.some(m=>m.name===name)){S.team.push({id:uid(),name,role:'Developer',email:e});n++}})}S.site.inviteDone=true;S.onb=4;if(n)toast(`${n} invitation${n>1?'s':''} sent. They appear on the Team page, where you assign Scrum roles.`);commit()};

function recommend(x){if(x.work==='bugs')return['bug','your team mostly works on bugs'];if(x.schedule==='tight')return['scrum','you deliver on a tight, regular schedule'];return['kanban','your schedule is flexible and work arrives continuously']}

  if(k===3)body=`<div class="onb card stack"><h2>Invite your team</h2><p class="muted">Great projects need great teams. Add teammates to plan, track and release together. They'll appear on the Team page.</p>

    <div class="row-flex" style="justify-content:flex-end"><button class="btn ghost" onclick="A.onb(5)">Skip</button><button class="btn primary" data-tour="su-next4" onclick="A.onb(5)" ${ok?'':'disabled'}>Next</button></div></div>`}
  if(k===5){const [rec,why]=recommend(x);body=`<div class="stack"><div><h2>Jira recommends ${TPLS[rec][0]}</h2><p class="muted" style="margin-top:4px">Because ${why}. You can pick any template; this course uses Scrum.</p></div>

    <div class="tpl">${Object.entries(TPLS).map(([key,[t,d]])=>`<div class="tplc ${rec===key?'on':''}"><b>${t}${rec===key?' <span class="loz active">Recommended</span>':''}</b><small>${d}</small><div><button class="btn ${key==='scrum'?'primary':''} sm" ${key==='scrum'?'data-tour="su-scrum"':''} onclick="A.pickTplOnb('${key}')">Select</button></div></div>`).join('')}</div>

  return `<div class="head"><div><h1>Sign up for Jira</h1><p>Create the site your team's projects will live in, the same way JiraTutorial1 starts.</p></div></div>${head}${body}`}
function setupView(){

  if(!S.project){return `<div class="head"><div><h1>Create a project</h1><p>Choose a template, then name your project. The template decides which features the project gets.</p></div></div>
  <div class="stack">
    <div class="tpl">
      <button class="tplc ${UI.tpl==='scrum'?'on':''}" onclick="A.pickTpl('scrum')"><b>Scrum</b><small>Plan work in fixed-length sprints. Includes a backlog, sprint planning, a sprint board, burndown and velocity reports.</small></button>
      <button class="tplc ${UI.tpl==='kanban'?'on':''}" onclick="A.pickTpl('kanban')"><b>Kanban</b><small>Continuous flow with work-in-progress limits. No sprints. Suits support and operations teams.</small></button>
    </div>
    ${UI.tpl==='kanban'?'<div class="note-warn">Kanban projects have no sprints. This course practises Scrum, so pick the Scrum template.</div>':''}
    <div class="card stack" style="max-width:640px">

A.bsTab=t=>{UI.bsTab=t;if(t==='qf'||t==='columns')UI.colErr=UI.qfErr=null;render()};
A.addCol=()=>{const raw=val('col-name').trim();if(!raw)return;const norm=x=>x.toLowerCase().replace(/s$/,'').trim();const m=ST.find(([k,l])=>norm(l)===norm(raw));if(!m){UI.colErr=`"${raw}" isn't one of the team's agreed columns. The working agreement lists: ${NINE.join(', ')}.`;render();return}if(S.columns.some(c=>c.name.toLowerCase()===m[1].toLowerCase())){UI.colErr=`There is already a ${m[1]} column.`;render();return}S.columns.forEach(c=>c.statuses=c.statuses.filter(x=>x!==m[0]));S.columns.push({name:m[1],statuses:[m[0]]});UI.colErr=null;commit();setTimeout(()=>{const e=document.getElementById('col-name');if(e)e.focus()},0)};
A.delCol=k=>{S.columns.splice(k,1);commit()};
A.moveCol=(k,d)=>{const j=k+d;if(j<0||j>=S.columns.length)return;const t=S.columns[k];S.columns[k]=S.columns[j];S.columns[j]=t;commit()};
A.setEst=v=>{S.estimation=v;if(v!=='Story Points')toast('This course estimates in Story Points. Jira would now total a different statistic.');commit()};
A.togDay=d=>{const w=S.workdays;const k=w.indexOf(d);if(k>=0)w.splice(k,1);else{w.push(d);w.sort()}commit()};
function boardSettingsView(){const t=UI.bsTab||'columns';const tabs=[['general','General',0],['columns','Columns',1],['swimlanes','Swimlanes',0],['qf','Quick Filters',1],['cardcolors','Card colors',0],['cardlayout','Card layout',0],['estimation','Estimation',1],['workdays','Working days',1],['detail','Issue Detail View',0]];
  let body='';
  if(t==='columns'){const um=unmapped();body=`<h2>Column management</h2><p class="muted">Columns can be added, removed, reordered and renamed. Each column is mapped to a status, and issues move left to right as the work progresses. Replace the default columns with the 9 from the team's working agreement, in order.</p>
    ${columnsDone()?'<div class="note-ok">All 9 columns are set up in the right order.</div>':''}
    <div class="cm">${S.columns.map((c,k)=>`<div class="cm-col" ${c.dflt?'data-default="1"':''}><div class="cm-h"><b>${esc(c.name)}</b><button class="btn ghost sm" data-tour="col-del" onclick="A.delCol(${k})" aria-label="Delete column ${esc(c.name)}" title="Delete column">✕</button></div><div class="cm-st">${c.statuses.map(x=>`<span class="loz ${stCls(x)}">${statusLabel(x)}</span>`).join('')||'<span class="muted">No status</span>'}</div><div class="cm-mv"><button class="btn ghost sm" onclick="A.moveCol(${k},-1)" ${k?'':'disabled'} aria-label="Move left">←</button><button class="btn ghost sm" onclick="A.moveCol(${k},1)" ${k<S.columns.length-1?'':'disabled'} aria-label="Move right">→</button></div></div>`).join('')}
      <div class="cm-col unm"><div class="cm-h"><b>Unmapped statuses</b></div><div class="cm-st">${um.map(x=>`<span class="loz">${statusLabel(x)}</span>`).join('')||'<span class="muted">None</span>'}</div><div class="muted" style="font-size:12px">Issues here don't show on the board.</div></div></div>
    <div class="row-flex" style="flex-wrap:nowrap;max-width:520px"><input id="col-name" placeholder="Column name, e.g. ${esc((NINE.find(n=>!S.columns.some(c=>c.name===n))||'Backlog'))}" onkeydown="if(event.key==='Enter')A.addCol()" aria-label="New column name"><button class="btn" data-tour="col-add" onclick="A.addCol()">Add column</button></div>

  else if(t==='estimation'){body=`<h2>Estimation</h2><p class="muted">The estimation statistic is what the team estimates with, and what the burndown and velocity charts count.</p><label class="f" style="max-width:300px">Estimation statistic<select onchange="A.setEst(this.value)">${['Story Points','Original Time Estimate','Issue Count'].map(o=>`<option ${S.estimation===o?'selected':''}>${o}</option>`).join('')}</select></label><p class="muted">Make sure it's set to <b>Story Points</b>, as in JiraTutorial1.</p>`}
  else if(t==='workdays'){const D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];body=`<h2>Working days</h2><p class="muted">Days the team works. Non-working days are left out of the sprint's days remaining and the burndown. Monday to Friday is standard.</p><div class="stack" style="gap:6px">${[1,2,3,4,5,6,0].map(d=>`<label class="row-flex" style="flex-wrap:nowrap"><input type="checkbox" style="width:auto" ${S.workdays.includes(d)?'checked':''} onchange="A.togDay(${d})">${D[d]}</label>`).join('')}</div><p class="muted">Non-working days: add holidays such as the holiday shut-down period in the release plan.</p>`}
  return `<div class="head"><div><h1>Settings for ${esc(S.project.key)} board</h1></div><button class="btn" onclick="A.go(activeSprint()?'board':'backlog')">← Back to board</button></div>
  <div class="bs"><nav class="bs-nav" aria-label="Board settings">${tabs.map(([k,l,on])=>on?`<button class="${t===k?'on':''}" data-tour="bs-${k}" onclick="A.bsTab('${k}')">${l}</button>`:`<span title="Not part of this course">${l}</span>`).join('')}</nav><div class="card stack">${body}</div></div>`}
A.openVersion=()=>dialog('Create version',`<label class="f">Name<input id="rl-name" placeholder="e.g. Release 1"></label><div class="row-flex" style="flex-wrap:nowrap"><label class="f" style="flex:1">Start date<input id="rl-start" type="date"></label><label class="f" style="flex:1">Release date<input id="rl-end" type="date"></label></div><label class="f">Description<input id="rl-desc" placeholder="e.g. Get In bare bones"></label>`,[{label:'Cancel'},{label:'Save',kind:'primary',fn:()=>{const v=val('rl-name').trim();if(!v){toast('Give the version a name.');return false}if(S.releases.some(r=>r.name.toLowerCase()===v.toLowerCase())){toast('A version with that name exists.');return false}S.releases.push({name:v,start:val('rl-start'),end:val('rl-end'),desc:val('rl-desc').trim()});toast(`Version ${v} created.`)}}]);

  const sec=sp=>{const items=sprintIssues(sp.id);const total=sum(items);const pct=Math.min(100,Math.round(100*total/Math.max(1,f.val)));const cls=total>f.val?'over':(pct>=90?'near':'');

      </div>

function burnChart(sp,W,H){const len=sp.length;const pad={l:34,r:12,t:12,b:26};const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const data=[];for(let d=0;d<=sp.day;d++){data.push(sp.burn[d]!=null?sp.burn[d]:(data[d-1]??sp.committed))}
  if(sp.state==='active')data[sp.day]=remaining(sp);
  const ymax=Math.max(1,sp.committed+(sp.scopeAdded||0),...data);const step=ymax>40?10:(ymax>16?5:(ymax>8?2:1));const top=Math.ceil(ymax/step)*step;
  const x=d=>pad.l+iw*d/len,y=v=>pad.t+ih*(1-v/top);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const xs=len>5?[0,2,4,6,8,10]:[0,1,2,3,4,5];xs.forEach(d=>{if(d<=len)g+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle">${d===0?'Day 0':d}</text>`});
  const pts=data.map((v,d)=>`${x(d)},${y(v)}`).join(' ');
  const area=data.length>1?`<polygon class="area" points="${x(0)},${y(0)} ${pts} ${x(data.length-1)},${y(0)}"/>`:'';
  const scope=(sp.changes||[]).filter(c=>c.delta>0).map(c=>`<line class="scope" x1="${x(c.day)}" x2="${x(c.day)}" y1="${pad.t}" y2="${pad.t+ih}" stroke-dasharray="2 3"/>`).join('');
  const last=data.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Burndown: ${data[last]} of ${sp.committed} points remaining on day ${sp.day}">${g}${scope}<line class="ideal" x1="${x(0)}" y1="${y(sp.committed)}" x2="${x(len)}" y2="${y(0)}"/>${area}<polyline class="actual" points="${pts}"/><circle class="dot" cx="${x(last)}" cy="${y(data[last])}" r="4.5"/></svg>`}
A.qf=id=>{UI.qf=UI.qf===id?null:id;if(UI.qf)S.flags.qfUsed=true;commit()};
function qfFilter(q,sp){if(!q)return()=>true;if(q.builtin==='me'){const me=S.site&&S.team.find(t=>t.name===S.site.first+' '+S.site.last);return i=>!!me&&i.assignee===me.id}if(q.builtin==='recent')return i=>i.updDay!=null&&i.updDay>=sp.day-1;return i=>i.assignee===q.member}
function boardView(){const sp=activeSprint();

  const all=sprintIssues(sp.id);const qf=S.qfs.find(q=>q.id===UI.qf);const items=all.filter(qfFilter(qf,sp));const rem=remaining(sp);
