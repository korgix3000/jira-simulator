  ${sp.day>=sp.length?`<div class="banner warn"><b>0 days remaining.</b> Complete the sprint, then hold the review and retrospective.<button class="btn primary sm" data-tour="complete" onclick="A.askComplete()">Complete sprint</button></div>`:''}
  ${hidden?`<div class="banner warn">${hidden} issue${hidden>1?'s are':' is'} in a status that isn't mapped to a column, so ${hidden>1?'they don\'t':'it doesn\'t'} show on the board. Map ${hidden>1?'them':'it'} in Board settings → Columns.</div>`:''}
  <div class="qf"><span class="muted" style="font-size:13px">Quick filters:</span>${S.qfs.slice().sort((x,y)=>(!!x.builtin)-(!!y.builtin)).map(q=>`<button class="${UI.qf===q.id?'on':''}" title="${esc(q.jql)}" onclick="A.qf('${q.id}')">${esc(q.name)}</button>`).join('')}${UI.qf?`<button class="clear" onclick="A.qf(null)">Clear all</button>`:''}</div>
  <div class="board" style="grid-template-columns:repeat(${S.columns.length||1},minmax(${S.columns.length>4?190:240}px,1fr))">${S.columns.map(col).join('')||'<div class="empty">This board has no columns. Add them in Board settings → Columns.</div>'}</div>
  <div class="sprint-bar">
    <div class="card"><div class="row-flex" style="justify-content:space-between"><h3>Burndown</h3><span class="muted num">${rem} pts left</span></div>${burnChart(sp,340,200)}<div class="legend"><span><i style="background:var(--accent)"></i>Remaining</span><span><i style="background:var(--muted)"></i>Ideal</span>${(sp.scopeAdded||0)>0?`<span><i style="background:var(--warn)"></i>Scope added</span>`:''}</div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">The line drops only when issues reach Done. Work in Development, QA or UAT doesn't count yet.</p></div>
    <div class="card"><h3>Daily stand-up${su?` · morning of day ${su.day}`:''}</h3>${su?`<div class="su-line h"><span>Team member</span><span>Yesterday</span><span>Today</span><span>Blockers</span></div>${su.lines.map(l=>`<div class="su-line"><b>${esc(l.who)}</b><span>${esc(l.y)}</span><span>${esc(l.t)}</span><span style="${l.b!=='None'?'color:var(--bad);font-weight:600':''}">${esc(l.b)}</span></div>`).join('')}`:'<p class="muted" style="margin:6px 0 0">Press Next day to hold the first stand-up: 3 to 5 minutes per person, any blockers?</p>'}</div>
  </div>`}
function bcard(i){const need=i.points||i.size||3;const pr=Math.min(100,Math.round(100*(i.progress||0)/need));
  return `<div class="bcard ${i.blocked?'blocked':''}" draggable="true" ondragstart="A.dragStart(event,'${i.id}')" onclick="A.open('${i.id}')"><span class="t">${esc(i.summary)}</span>${i.blocked?`<span class="flag">${esc(i.blocked)}</span>`:''}${i.fix?`<span class="muted" style="font-size:12px">${esc(i.fix)}</span>`:''}${epicTag(i.epic)?`<span>${epicTag(i.epic)}</span>`:''}${WORKING.includes(i.status)?`<div class="prog" title="${pr}% done"><i style="width:${pr}%"></i></div>`:''}<div class="meta">${ti(i.type)}<span class="key">${i.key}${i.mid?' · added mid-sprint':''}</span>${prio(i.prio)}${ptsChip(i)}${av(member(i.assignee))}</div></div>`}

function reportsView(){const all=S.sprints.filter(s=>s.state!=='future');
  if(!all.length)return `<div class="head"><div><h1>Reports</h1></div></div><div class="empty"><h2>No sprint data yet</h2><p>Start a sprint to see its burndown. Complete it to see the sprint report and velocity.</p></div>`;
  let sp=sprintOf(S.reportSprint);if(!sp||sp.state==='future')sp=all[all.length-1];
  const items=S.issues.filter(i=>i.sprint===sp.id);
  const done=sp.state==='closed'?(sp.doneKeys||[]):items.filter(i=>i.status==='done').map(i=>i.key);
  const openK=sp.state==='closed'?(sp.openKeys||[]):items.filter(i=>i.status!=='done').map(i=>i.key);
  const find=k=>S.issues.find(i=>i.key===k);
  const closed=closedSprints();
  return `<div class="head"><div><h1>Reports</h1><p>What happened in each sprint. These charts are what you show at the sprint review and discuss at the retrospective.</p></div>
    <label class="f" style="min-width:220px">Sprint<select onchange="A.reportSprint(this.value)">${all.map(s=>`<option value="${s.id}" ${s.id===sp.id?'selected':''}>${esc(s.name)} (${s.state==='active'?'active':'completed'})</option>`).join('')}</select></label></div>
  <div class="stats">
    <div class="stat"><b>${sp.committed}</b><span>points committed at start</span></div>
    <div class="stat"><b>${sp.scopeAdded||0}</b><span>points added mid-sprint</span></div>
    <div class="stat"><b>${sp.state==='closed'?sp.completed:sum(items.filter(i=>i.status==='done'))}</b><span>points completed</span></div>
    <div class="stat"><b>${openK.length}</b><span>issues not completed</span></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Burndown · ${esc(sp.name)}</h2><p class="muted" style="font-size:14px">Goal: ${esc(sp.goal)}</p>${burnChart(sp,520,250)}<div class="legend"><span><i style="background:var(--accent)"></i>Remaining points</span><span><i style="background:var(--muted)"></i>Ideal pace</span>${(sp.scopeAdded||0)>0?`<span><i style="background:var(--warn)"></i>Scope added</span>`:''}</div></div>
    <div class="card"><h2>Velocity</h2><p class="muted" style="font-size:14px">Points committed vs completed per sprint. The average is the forecast for planning.</p>${closed.length?velChart(closed):'<p class="muted">Complete a sprint to see velocity.</p>'}</div>
    <div class="card" style="grid-column:1/-1"><h2>Sprint report</h2>
      <table><thead><tr><th>Key</th><th>Summary</th><th>Points</th><th>Result</th></tr></thead><tbody>
      ${done.map(k=>{const i=find(k);return i?`<tr><td>${k}</td><td>${esc(i.summary)}${i.mid?' <span class="loz">added mid-sprint</span>':''}</td><td class="num">${pts(i)}</td><td><span class="loz done">Completed</span></td></tr>`:''}).join('')}
      ${openK.map(k=>{const i=find(k);return i?`<tr><td>${k}</td><td>${esc(i.summary)}</td><td class="num">${pts(i)}</td><td><span class="loz">${sp.state==='closed'?'Not completed, moved':statusLabel(i.status)}</span></td></tr>`:''}).join('')}
      </tbody></table></div>
  </div>
  ${sp.state==='closed'?`<div class="row-flex" style="margin-top:16px"><button class="btn primary" onclick="A.retroSprint('${sp.id}');A.go('retro')">Go to the retrospective</button></div>`:''}`}
function velChart(list){const W=520,H=250,pad={l:34,r:12,t:12,b:30};const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;const max=Math.max(1,...list.map(s=>Math.max(s.committed+(s.scopeAdded||0),s.completed)));const step=max>40?10:(max>16?5:2);const top=Math.ceil(max/step)*step;const y=v=>pad.t+ih*(1-v/top);const gw=iw/Math.max(list.length,3);const bw=Math.min(34,gw/3);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  list.forEach((s,k)=>{const cx=pad.l+gw*k+gw/2;const c=s.committed;g+=`<rect class="b-commit" x="${cx-bw-2}" y="${y(c)}" width="${bw}" height="${y(0)-y(c)}" rx="2"/><rect class="b-done" x="${cx+2}" y="${y(s.completed)}" width="${bw}" height="${y(0)-y(s.completed)}" rx="2"/><text x="${cx-bw/2-2}" y="${y(c)-4}" text-anchor="middle">${c}</text><text x="${cx+bw/2+2}" y="${y(s.completed)-4}" text-anchor="middle">${s.completed}</text><text x="${cx}" y="${H-10}" text-anchor="middle">${esc(s.name.replace(S.project.key+' ',''))}</text>`});
  const avg=forecast().val;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Velocity chart">${g}</svg><div class="legend"><span><i style="background:var(--line);height:10px"></i>Committed</span><span><i style="background:var(--good);height:10px"></i>Completed</span><span>Forecast for next sprint: <b class="num">${avg} pts</b></span></div>`}

function retroView(){const closed=closedSprints();
  if(!closed.length)return `<div class="head"><div><h1>Retrospective</h1></div></div><div class="empty"><h2>Complete a sprint first</h2><p>The retrospective happens at the end of each sprint, after the sprint review.</p></div>`;

  return `<div class="head"><div><h1>Retrospective · ${esc(sp.name)}</h1><p>${sp.completed} of ${sp.committed+(sp.scopeAdded||0)} points completed. Talk about how the team worked, then agree on what to change.</p></div>
    ${closed.length>1?`<label class="f" style="min-width:200px">Sprint<select onchange="A.retroSprint(this.value)">${closed.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:''}</div>

function issuesView(){const f=UI.issf||'open';const sel={open:i=>i.status!=='done',done:i=>i.status==='done',all:()=>true,mine:i=>{const me=S.site&&S.team.find(t=>t.name===S.site.first+' '+S.site.last);return me&&i.assignee===me.id}}[f];

function modal(i){const sp=i.sprint?sprintOf(i.sprint):null;const locked=sp&&sp.state==='closed';const open=S.sprints.filter(s=>s.state!=='closed');const p=UI.poker&&UI.poker.id===i.id?UI.poker:null;
  let poker='';if(p){const vs=p.votes.map(x=>x.v);const lo=Math.min(...vs),hi=Math.max(...vs);const spread=FIB.indexOf(hi)-FIB.indexOf(lo);const lw=p.votes.find(x=>x.v===lo).who,hw=p.votes.find(x=>x.v===hi).who;
    const counts={};vs.forEach(v=>counts[v]=(counts[v]||0)+1);const mode=+Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||b-a)[0];

      <label class="f">Fix version<select data-tour="fix-select" onchange="A.set('${i.id}','fix',this.value)">${opt([['','None'],...S.releases.map(r=>[r.name,r.name])],i.fix)}</select></label>
      <label class="f">Priority<select onchange="A.set('${i.id}','prio',this.value)">${opt(PRIOS.map(x=>[x,x]),i.prio)}</select></label>
      ${i.type==='task'?`<div class="f"><span>Story points</span><span class="muted" style="font-weight:400">Tasks don't get story points: a task is ongoing work with an end, not a piece of user value (JiraTutorial3).</span></div>`:`<div class="f"><span>Story points</span><div class="fibrow" data-tour="points" style="flex-wrap:wrap">${FIB.map(v=>`<button class="fib ${i.points===v?'on':''}" onclick="A.setPts('${i.id}',${v})" ${locked?'disabled':''}>${v}</button>`).join('')}</div>
        ${!locked&&!p?`<div><button class="btn sm" data-tour="poker" style="margin-top:6px" onclick="A.poker('${i.id}')">Estimate with planning poker</button></div>`:''}</div>`}
      ${poker}
      ${!i.blocked&&!locked?`<button class="btn ghost sm" style="justify-self:start" onclick="A.flag('${i.id}')">Flag as blocked</button>`:''}
    </div></div>
  </div></div>`}
function dlgHTML(){const d=UI.dlg;return `<div class="overlay" style="z-index:30"><div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(d.title)}"><h2>${esc(d.title)}</h2><div class="stack" style="gap:10px">${d.body}</div><div class="acts">${d.actions.map(a=>`<button class="btn ${a.kind}" onclick="A.dlgAct(${a.k})">${esc(a.label)}</button>`).join('')}</div></div></div>`}

/* ---------- hint bubbles ---------- */
const CLIPS=['.board','.main','.lesson','.epic-scroll','.overlay'];
function shown(e){const r=e.getBoundingClientRect();if(r.width<=0||r.height<=0)return null;if(r.bottom<0||r.right<0||r.top>innerHeight||r.left>innerWidth)return null;for(const c of CLIPS){const p=e.closest(c);if(p&&p!==e){const q=p.getBoundingClientRect();if(r.bottom<q.top+4||r.top>q.bottom-4||r.right<q.left+4||r.left>q.right-4)return null}}return r}
let tourRaf=0;
function tour(){cancelAnimationFrame(tourRaf);tourRaf=requestAnimationFrame(drawTour)}
function drawTour(){const layer=document.getElementById('tour');document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));if(S.hints===false){layer.innerHTML='';return}
  const st=STAGES[S.stage];const cs=st.checks();const overlay=document.querySelector('.overlay');const out=[];
  let list=cs.map((c,k)=>({k,done:c[1],label:c[0],sels:c[2]||[]}));
  if(!cs.length||cs.every(c=>c[1]))list=[{k:-1,done:false,label:cs.length?'All tasks done. Go to the next step.':'Press Start to begin the lesson.',sels:['[data-tour=next-stage]']}];
  for(const t of list){if(t.done)continue;for(const sel of t.sels){let el=null,r=null;for(const e of document.querySelectorAll(sel)){if(overlay&&!overlay.contains(e))continue;const rr=shown(e);if(rr){el=e;r=rr;break}}if(el){if(!out.some(o=>o.el===el))out.push({...t,el,r});else{const o=out.find(o=>o.el===el);o.extra=(o.extra||[]).concat(t.k)}break}}}
  let h='';out.forEach((t,n)=>{const r=t.r;const x=Math.min(innerWidth-26,Math.max(2,r.right-10)),y=Math.min(innerHeight-26,Math.max(2,r.top-12));const num=t.k<0?'→':[t.k,...(t.extra||[])].map(v=>v+1).join(',');
    h+=`<div class="tdot ${n===0?'first':''}" style="left:${x}px;top:${y}px">${num}</div>`;
    if(n===0){t.el.classList.add('tour-hl');const w=250,hgt=64;let cx,cy,up=false;if(r.height>160&&r.right+w+16<innerWidth){cx=r.right+12;cy=Math.max(10,r.top+10)}else if(r.top-hgt-14>60){cx=Math.min(innerWidth-w-10,Math.max(10,r.left));cy=r.top-hgt-14;up=true}else{cx=Math.min(innerWidth-w-10,Math.max(10,r.left));cy=Math.min(innerHeight-hgt-10,r.bottom+12)}h+=`<div class="tcall ${up?'up':''}" style="left:${cx}px;top:${cy}px;width:${w}px"><b>${t.k<0?'Next':'Task '+(t.k+1)}</b>${esc(t.label)}</div>`}});
  layer.innerHTML=h}
addEventListener('resize',tour);document.addEventListener('scroll',tour,true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.dlg){UI.dlg=null;render()}else if(UI.create){A.ciClose()}else if(UI.modal)A.close()}});
document.addEventListener('dragend',()=>{document.querySelectorAll('.drag-over,.dropping').forEach(el=>el.classList.remove('drag-over','dropping'))});
render();
</script>
</body>
</html>
